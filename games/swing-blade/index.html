// ============================================================
// Swing Blade - UI & HUD
// ============================================================
// Score display, combo counter, menus, game over screen.
// ============================================================


class UI {
  constructor() {
    this.screenShake = 0;       // remaining shake duration in ms
    this.shakeIntensity = 0;

    // Floating text effects
    this.floatingTexts = [];

    // Score animation
    this.displayedScore = 0;
    this.actualScore = 0;
  }

  /**
   * Trigger screen shake (e.g., on blade hit).
   */
  shake(intensity = 5, durationMs = 200) {
    this.shakeIntensity = intensity;
    this.screenShake = durationMs;
  }

  /**
   * Add floating text at a position (e.g., "+50", "COMBO x3").
   */
  addFloatingText(text, x, y, color = COLORS.COMBO_TEXT) {
    this.floatingTexts.push({
      text,
      x,
      y,
      color,
      life: 1000,      // ms
      maxLife: 1000,
      vy: -1.5,        // float upward
    });
  }

  /**
   * Get screen shake offset for this frame.
   */
  getShakeOffset(dt) {
    if (this.screenShake <= 0) return { x: 0, y: 0 };

    this.screenShake -= dt;
    const progress = this.screenShake / 200;
    const intensity = this.shakeIntensity * progress;

    return {
      x: (Math.random() - 0.5) * intensity * 2,
      y: (Math.random() - 0.5) * intensity * 2,
    };
  }

  /**
   * Update floating texts.
   */
  update(dt, score) {
    this.actualScore = score;

    // Animate score counter
    if (this.displayedScore < this.actualScore) {
      const diff = this.actualScore - this.displayedScore;
      this.displayedScore += Math.max(1, Math.floor(diff * 0.1));
      if (this.displayedScore > this.actualScore) {
        this.displayedScore = this.actualScore;
      }
    }

    // Update floating texts
    const dtF = dt / 16.667;
    for (const ft of this.floatingTexts) {
      ft.life -= dt;
      ft.y += ft.vy * dtF;
    }
    this.floatingTexts = this.floatingTexts.filter(ft => ft.life > 0);
  }

  /**
   * Draw the HUD (score, combo, distance).
   */
  drawHUD(ctx, distance, comboCount, comboMultiplier, timeRemaining, superJumpState) {
    ctx.save();

    // Distance (top center)
    const distanceStr = Math.floor(distance) + 'm';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = COLORS.HUD_SHADOW;
    ctx.fillText(distanceStr, CANVAS.BASE_WIDTH / 2 + 2, 42);
    ctx.fillStyle = COLORS.HUD_TEXT;
    ctx.fillText(distanceStr, CANVAS.BASE_WIDTH / 2, 40);

    // Score (top left)
    const scoreStr = 'SCORE: ' + this.displayedScore;
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = COLORS.HUD_SHADOW;
    ctx.fillText(scoreStr, 22, 32);
    ctx.fillStyle = COLORS.HUD_TEXT;
    ctx.fillText(scoreStr, 20, 30);

    // Combo (top right) - only show if active
    if (comboCount > 1) {
      const comboStr = 'COMBO x' + comboMultiplier.toFixed(1);
      ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'right';

      // Pulse effect
      const pulse = 1 + Math.sin(Date.now() * 0.01) * 0.1;
      ctx.save();
      ctx.translate(CANVAS.BASE_WIDTH - 20, 30);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = COLORS.HUD_SHADOW;
      ctx.fillText(comboStr, 2, 2);
      ctx.fillStyle = COLORS.COMBO_TEXT;
      ctx.fillText(comboStr, 0, 0);
      ctx.restore();
    }

    // Timer removed - no longer used

    // Persistent Super Jump indicator (bottom right) while a charge is banked
    if (superJumpState) {
      const superJumpMode = typeof superJumpState === 'string' ? superJumpState : superJumpState.mode;
      const flash = superJumpMode === 'charged' ? (Math.floor(Date.now() / 220) % 2 === 0) : true;
      const superJumpLabel = typeof superJumpState === 'string'
        ? 'SUPER JUMP'
        : `SUPER JUMP ${superJumpState.used}/${superJumpState.max}`;
      ctx.font = 'bold 18px monospace';
      ctx.textAlign = 'right';
      ctx.fillStyle = COLORS.HUD_SHADOW;
      ctx.fillText(superJumpLabel, CANVAS.BASE_WIDTH - 18, CANVAS.BASE_HEIGHT - 18);
      ctx.fillStyle = flash ? '#00ff66' : '#88ffaa';
      ctx.fillText(superJumpLabel, CANVAS.BASE_WIDTH - 20, CANVAS.BASE_HEIGHT - 20);
    }

    ctx.restore();
  }

  /**
   * Draw floating texts (world space).
   */
  drawFloatingTexts(ctx, cameraX, cameraY) {
    for (const ft of this.floatingTexts) {
      const screenX = ft.x - cameraX;
      const screenY = ft.y - cameraY;
      const alpha = ft.life / ft.maxLife;

      ctx.globalAlpha = alpha;
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, screenX, screenY);
    }
    ctx.globalAlpha = 1;
  }

  /**
   * Draw the title screen.
   */
  drawTitleScreen(ctx) {
    const W = CANVAS.BASE_WIDTH;
    const H = CANVAS.BASE_HEIGHT;
    const now = Date.now();

    // Pitch black background
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    // Red moon
    const moonX = W * 0.75;
    const moonY = H * 0.18;
    const moonR = 40;
    // Moon glow
    const moonGlow = ctx.createRadialGradient(moonX, moonY, moonR * 0.5, moonX, moonY, moonR * 3);
    moonGlow.addColorStop(0, 'rgba(180, 20, 20, 0.15)');
    moonGlow.addColorStop(0.5, 'rgba(100, 10, 10, 0.06)');
    moonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = moonGlow;
    ctx.fillRect(0, 0, W, H);
    // Moon body
    ctx.beginPath();
    ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
    ctx.fillStyle = '#8b1a1a';
    ctx.fill();
    // Moon highlight
    ctx.beginPath();
    ctx.arc(moonX - 8, moonY - 8, moonR * 0.85, 0, Math.PI * 2);
    ctx.fillStyle = '#a02020';
    ctx.fill();
    // Subtle craters
    ctx.beginPath();
    ctx.arc(moonX + 10, moonY + 5, 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(60, 10, 10, 0.4)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(moonX - 5, moonY + 12, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(moonX + 3, moonY - 10, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.textAlign = 'center';

    // "SWING BLADE" title with pulsing glow
    const titleY = H * 0.15;
    const pulse = 0.7 + Math.sin(now * 0.003) * 0.3;

    ctx.font = 'bold 64px monospace';
    ctx.shadowColor = `rgba(200, 0, 0, ${pulse * 0.6})`;
    ctx.shadowBlur = 30;
    ctx.fillStyle = `rgba(200, 0, 0, ${pulse * 0.4})`;
    ctx.fillText('SWING BLADE', W / 2, titleY);

    ctx.shadowBlur = 15;
    ctx.shadowColor = `rgba(255, 50, 50, ${pulse * 0.5})`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('SWING BLADE', W / 2, titleY);
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';

    // Subtitle
    ctx.font = '18px monospace';
    ctx.fillStyle = 'rgba(220, 60, 60, 0.9)';
    ctx.fillText('You must Escape the City', W / 2, titleY + 38);

    // Instructions — Jay's exact text
    ctx.font = '16px monospace';
    ctx.fillStyle = 'rgba(220, 220, 220, 0.85)';
    const instrY = H * 0.35;
    const lines = [
      'Space = Jump, Shoot Hook (in Air), Release Hook',
      'C = Blade Attack',
      'Left / Right = Move',
      'Up / Down = Climb / Descend Hook',
    ];
    lines.forEach((line, i) => {
      ctx.fillText(line, W / 2, instrY + i * 28);
    });

    // Tips
    ctx.font = '15px monospace';
    ctx.fillStyle = 'rgba(200, 200, 200, 0.7)';
    const tipY = instrY + lines.length * 28 + 30;
    const tipLines = [
      'Earn up to 5 Super Jumps per run',
      'Costs 3, 4, 5, 6, then 7 bounces',
      '',
      'Load Super Jump by holding down,',
      'also saves from falling',
    ];
    tipLines.forEach((line, i) => {
      if (line) ctx.fillText(line, W / 2, tipY + i * 24);
    });

    // "Press Space" — flashing (hard blink)
    if (Math.floor(now / 500) % 2 === 0) {
      ctx.font = 'bold 28px monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Press Space', W / 2, H * 0.90);
    }
  }

  /**
   * Draw the game over screen.
   */
  drawGameOver(ctx, distance, score, antiCheatResult = null) {
    // Darken background
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, CANVAS.BASE_WIDTH, CANVAS.BASE_HEIGHT);

    // Game Over
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = COLORS.BLADE_TRAIL;
    ctx.fillText('GAME OVER', CANVAS.BASE_WIDTH / 2, CANVAS.BASE_HEIGHT * 0.3);

    // Stats
    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = COLORS.HUD_TEXT;
    ctx.fillText('Distance: ' + Math.floor(distance) + 'm', CANVAS.BASE_WIDTH / 2, CANVAS.BASE_HEIGHT * 0.45);

    ctx.fillStyle = COLORS.COMBO_TEXT;
    ctx.fillText('Score: ' + score, CANVAS.BASE_WIDTH / 2, CANVAS.BASE_HEIGHT * 0.53);

    if (antiCheatResult && antiCheatResult.message) {
      ctx.font = 'bold 16px monospace';
      ctx.fillStyle = antiCheatResult.verdict === 'robotic' ? '#ff6666' : '#ffcc66';
      ctx.fillText(antiCheatResult.message, CANVAS.BASE_WIDTH / 2, CANVAS.BASE_HEIGHT * 0.64);
    }

    // Restart prompt
    if (Math.floor(Date.now() / 600) % 2 === 0) {
      ctx.font = 'bold 20px monospace';
      ctx.fillStyle = COLORS.ROPE;
      ctx.fillText('Press SPACE to Play Again', CANVAS.BASE_WIDTH / 2, CANVAS.BASE_HEIGHT * 0.8);
    }
  }
}

// ============================================================
// Swing Blade - Particle System
// ============================================================
// Lightweight particle system for visual juice:
// sparks, dust, blade trails, grapple sparks, death explosions.
// ============================================================


class Particle {
  constructor(x, y, vx, vy, life, size, color, gravity = 0, shrink = true, fadeOut = true) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.life = life;
    this.maxLife = life;
    this.size = size;
    this.maxSize = size;
    this.color = color;
    this.gravity = gravity;
    this.shrink = shrink;
    this.fadeOut = fadeOut;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotationSpeed = (Math.random() - 0.5) * 0.2;
  }

  update(dt) {
    const dtF = dt / 16.667;
    this.life -= dt;
    this.x += this.vx * dtF;
    this.y += this.vy * dtF;
    this.vy += this.gravity * dtF;
    this.vx *= Math.pow(0.98, dtF); // friction
    this.rotation += this.rotationSpeed * dtF;

    if (this.shrink) {
      this.size = this.maxSize * (this.life / this.maxLife);
    }
  }

  draw(ctx, cameraX, cameraY) {
    const screenX = this.x - cameraX;
    const screenY = this.y - cameraY;
    const alpha = this.fadeOut ? (this.life / this.maxLife) : 1;

    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;

    ctx.save();
    ctx.translate(screenX, screenY);
    ctx.rotate(this.rotation);
    ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
    ctx.restore();
  }
}

class ParticleSystem {
  constructor() {
    this.particles = [];
  }

  update(dt) {
    for (const p of this.particles) {
      p.update(dt);
    }
    this.particles = this.particles.filter(p => p.life > 0);
  }

  draw(ctx, cameraX, cameraY) {
    for (const p of this.particles) {
      p.draw(ctx, cameraX, cameraY);
    }
    ctx.globalAlpha = 1;
  }

  /**
   * Blade slash sparks - burst of bright particles on hit.
   */
  bladeHitSparks(x, y) {
    const colors = ['#ffdd44', '#ff8844', '#ffffff', '#ff4466'];
    for (let i = 0; i < 12; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 5;
      this.particles.push(new Particle(
        x, y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        300 + Math.random() * 300,  // life
        2 + Math.random() * 4,     // size
        colors[Math.floor(Math.random() * colors.length)],
        0.05,                       // gravity
        true, true
      ));
    }

    // Central flash
    this.particles.push(new Particle(
      x, y, 0, 0,
      150,    // life
      20,     // size
      '#ffffff',
      0, true, true
    ));
  }

  /**
   * Blade swing trail - line of particles along the slash arc.
   */
  bladeTrail(x, y, facingRight) {
    for (let i = 0; i < 5; i++) {
      const offsetX = (Math.random() - 0.5) * 30 * (facingRight ? 1 : -1);
      const offsetY = (Math.random() - 0.5) * 30;
      this.particles.push(new Particle(
        x + offsetX, y + offsetY,
        (Math.random() - 0.5) * 1,
        (Math.random() - 0.5) * 1,
        200 + Math.random() * 100,
        1 + Math.random() * 2,
        COLORS.BLADE_TRAIL,
        0, true, true
      ));
    }
  }

  /**
   * Landing dust - puff when landing on a platform.
   */
  landingDust(x, y) {
    for (let i = 0; i < 8; i++) {
      const dir = i < 4 ? -1 : 1;
      this.particles.push(new Particle(
        x + (Math.random() - 0.5) * 20,
        y,
        dir * (1 + Math.random() * 2),
        -(0.5 + Math.random() * 1.5),
        400 + Math.random() * 200,
        3 + Math.random() * 3,
        'rgba(200, 200, 220, 0.8)',
        0.08,
        true, true
      ));
    }
  }

  /**
   * Grapple attach sparks - when hook connects to anchor.
   */
  grappleAttach(x, y) {
    const colors = [COLORS.ROPE, '#ffee88', '#ffffff'];
    for (let i = 0; i < 8; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      this.particles.push(new Particle(
        x, y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        250 + Math.random() * 150,
        2 + Math.random() * 2,
        colors[Math.floor(Math.random() * colors.length)],
        0.02,
        true, true
      ));
    }
  }

  /**
   * Rope release burst - when letting go of the rope.
   */
  ropeRelease(x, y, vx, vy) {
    for (let i = 0; i < 6; i++) {
      this.particles.push(new Particle(
        x, y,
        vx * 0.3 + (Math.random() - 0.5) * 2,
        vy * 0.3 + (Math.random() - 0.5) * 2,
        300 + Math.random() * 200,
        1 + Math.random() * 2,
        COLORS.ROPE,
        0.05,
        true, true
      ));
    }
  }

  /**
   * Speed lines - while moving fast, trailing particles.
   */
  speedLines(x, y, vx, vy) {
    const speed = Math.sqrt(vx * vx + vy * vy);
    if (speed < 5) return; // only show at high speed

    if (Math.random() > 0.4) return; // don't spam every frame

    this.particles.push(new Particle(
      x + (Math.random() - 0.5) * 10,
      y + (Math.random() - 0.5) * 10,
      -vx * 0.1,
      -vy * 0.1,
      150 + Math.random() * 100,
      1 + Math.random() * 1.5,
      'rgba(255, 255, 255, 0.4)',
      0, true, true
    ));
  }

  /**
   * Death explosion - player dies.
   */
  deathExplosion(x, y) {
    const colors = [COLORS.PLAYER, '#ff8844', '#ffdd44', '#ffffff', COLORS.BLADE_TRAIL];
    for (let i = 0; i < 25; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 6;
      this.particles.push(new Particle(
        x, y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        500 + Math.random() * 500,
        3 + Math.random() * 5,
        colors[Math.floor(Math.random() * colors.length)],
        0.1,
        true, true
      ));
    }

    // Big central flash
    this.particles.push(new Particle(
      x, y, 0, 0,
      300,
      40,
      '#ffffff',
      0, true, true
    ));
  }

  /**
   * Obstacle death - when slicing an obstacle.
   */
  obstacleDestroy(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 4;
      this.particles.push(new Particle(
        x, y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        300 + Math.random() * 300,
        2 + Math.random() * 4,
        color,
        0.08,
        true, true
      ));
    }
  }

  /**
   * Ambient city particles - occasional floating dust/light motes.
   */
  ambientMote(cameraX, cameraY, canvasWidth, canvasHeight) {
    if (Math.random() > 0.02) return; // very sparse

    const x = cameraX + Math.random() * canvasWidth;
    const y = cameraY + Math.random() * canvasHeight;

    this.particles.push(new Particle(
      x, y,
      (Math.random() - 0.5) * 0.3,
      -0.2 - Math.random() * 0.3,
      3000 + Math.random() * 2000,
      1 + Math.random() * 1.5,
      'rgba(255, 255, 200, 0.3)',
      -0.001, // float upward
      false, true
    ));
  }
}

/**
 * Convert a pixel art array to an offscreen canvas.
 * @param {Array<Array<string|null>>} pixels - 2D array of hex colors
 * @param {number} scale - pixel scale multiplier
 * @returns {HTMLCanvasElement}
 */
function createSprite(pixels, scale = 1) {
  const h = pixels.length;
  const w = pixels[0].length;
  const canvas = document.createElement('canvas');
  canvas.width = w * scale;
  canvas.height = h * scale;
  const ctx = canvas.getContext('2d');

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const color = pixels[y][x];
      if (color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * scale, y * scale, scale, scale);
      }
    }
  }

  return canvas;
}

// ============================================================
// SPRITE MANAGER
// ============================================================

class SpriteManager {
  constructor() {
    this.loaded = false;
    this.sprites = {};
    this._init();
  }

  _init() {
    const scale = 2; // each pixel art pixel = 2 screen pixels

    this.sprites = {
      ninjaIdle: createSprite(NINJA_IDLE, scale),
      ninjaSwing: createSprite(NINJA_SWING, scale),
      ninjaAirborne: createSprite(NINJA_AIRBORNE, scale),
      ninjaSlash: createSprite(NINJA_SLASH, scale),

      bird: createSprite(BIRD_SPRITE, scale),
      birdFlap: createSprite(BIRD_FLAP, scale),

      drone: createSprite(DRONE_SPRITE, scale),

      missile: createSprite(MISSILE_SPRITE, scale),

      anchor: createSprite(ANCHOR_SPRITE, scale),

      platformTile: createSprite(PLATFORM_TILE, scale),
    };

    // Also create flipped versions for facing left
    this.sprites.ninjaIdleFlip = this._flipHorizontal(NINJA_IDLE, scale);
    this.sprites.ninjaSwingFlip = this._flipHorizontal(NINJA_SWING, scale);
    this.sprites.ninjaAirborneFlip = this._flipHorizontal(NINJA_AIRBORNE, scale);
    this.sprites.ninjaSlashFlip = this._flipHorizontal(NINJA_SLASH, scale);
    this.sprites.birdFlip = this._flipHorizontal(BIRD_SPRITE, scale);
    this.sprites.birdFlapFlip = this._flipHorizontal(BIRD_FLAP, scale);

    // Enemy ninja sprites — same shapes, white palette
    const whiteRemap = {
      [K]: '#444444',   // outline → dark gray
      [B]: '#cccccc',   // body dark → light gray
      [G]: '#e8e8e8',   // body mid → near-white
      [L]: '#f5f5f5',   // body light → very light
      [W]: '#ffffff',   // eyes stay white
      [P]: '#aaaaaa',   // scarf → gray
      [R]: '#ffffff',   // red → white
      [O]: '#dddddd',   // accent → light
      [S]: '#f0f0f0',   // steel → white
      [D]: '#cccccc',   // steel dark → light
    };
    const recolor = (pixels) => pixels.map(row => row.map(c => c === null ? null : (whiteRemap[c] || c)));

    this.sprites.enemyIdle = createSprite(recolor(NINJA_IDLE), scale);
    this.sprites.enemySwing = createSprite(recolor(NINJA_SWING), scale);
    this.sprites.enemyAirborne = createSprite(recolor(NINJA_AIRBORNE), scale);
    this.sprites.enemySlash = createSprite(recolor(NINJA_SLASH), scale);
    this.sprites.enemyIdleFlip = this._flipHorizontal(recolor(NINJA_IDLE), scale);
    this.sprites.enemySwingFlip = this._flipHorizontal(recolor(NINJA_SWING), scale);
    this.sprites.enemyAirborneFlip = this._flipHorizontal(recolor(NINJA_AIRBORNE), scale);
    this.sprites.enemySlashFlip = this._flipHorizontal(recolor(NINJA_SLASH), scale);

    this.loaded = true;
  }

  /**
   * Get enemy ninja sprite for current state.
   */
  getEnemyNinja(state, bladeActive, facingRight) {
    let key;
    if (bladeActive) {
      key = facingRight ? 'enemySlash' : 'enemySlashFlip';
    } else if (state === ENinjaState.SWINGING) {
      key = facingRight ? 'enemySwing' : 'enemySwingFlip';
    } else if (state === ENinjaState.AIRBORNE) {
      key = facingRight ? 'enemyAirborne' : 'enemyAirborneFlip';
    } else {
      key = facingRight ? 'enemyIdle' : 'enemyIdleFlip';
    }
    return this.sprites[key];
  }

  _flipHorizontal(pixels, scale) {
    const flipped = pixels.map(row => [...row].reverse());
    return createSprite(flipped, scale);
  }

  /**
   * Get the appropriate ninja sprite for current state.
   */
  getNinja(state, bladeActive, facingRight) {
    let key;
    if (bladeActive) {
      key = facingRight ? 'ninjaSlash' : 'ninjaSlashFlip';
    } else if (state === 'swinging') {
      key = facingRight ? 'ninjaSwing' : 'ninjaSwingFlip';
    } else if (state === 'airborne' || state === 'grappling') {
      key = facingRight ? 'ninjaAirborne' : 'ninjaAirborneFlip';
    } else {
      key = facingRight ? 'ninjaIdle' : 'ninjaIdleFlip';
    }
    return this.sprites[key];
  }

  /**
   * Get bird sprite (alternates for wing flap).
   */
  getBird(flapPhase, facingRight) {
    const flapping = Math.sin(flapPhase) > 0;
    if (facingRight) {
      return flapping ? this.sprites.birdFlap : this.sprites.bird;
    }
    return flapping ? this.sprites.birdFlapFlip : this.sprites.birdFlip;
  }

  /**
   * Draw a sprite centered at a position.
   */
  drawCentered(ctx, sprite, x, y) {
    ctx.drawImage(
      sprite,
      x - sprite.width / 2,
      y - sprite.height / 2
    );
  }

  /**
   * Draw platform using tiling.
   */
  drawPlatform(ctx, x, y, width, height, cameraX, cameraY) {
    const tile = this.sprites.platformTile;
    const screenX = x - cameraX;
    const screenY = y - cameraY;

    // Tile horizontally
    const tileW = tile.width;
    for (let tx = 0; tx < width; tx += tileW) {
      const drawWidth = Math.min(tileW, width - tx);
      ctx.drawImage(
        tile,
        0, 0, drawWidth, tile.height,
        screenX + tx, screenY, drawWidth, tile.height
      );
    }
  }
}


// ===== game.js =====
// ============================================================
// Swing Blade - Main Game Loop
// ============================================================
// Ties everything together: state machine, update loop,
// render loop, and integration between all systems.
// ============================================================


const GameState = {
  TITLE: 'title',
  PLAYING: 'playing',
  GAME_OVER: 'game_over',
};

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');

    // Set canvas internal resolution
    this.canvas.width = CANVAS.BASE_WIDTH;
    this.canvas.height = CANVAS.BASE_HEIGHT;

    // Core systems
    this.input = new InputManager(canvas);
    this.input.eventSink = (evt) => this._onRawInput(evt);
    this.camera = new Camera();
    this.ui = new UI();
    this.particles = new ParticleSystem();
    this.spriteManager = new SpriteManager();

    // Game state
    this.state = GameState.TITLE;
    this.lastTime = 0;
    this.gameOverDelay = 0; // prevent instant restart

    // World seed (can be set for deterministic runs)
    this.seed = Math.floor(Math.random() * 1000000);

    // Initialize game objects (will be reset on start)
    this.player = null;
    this.rope = null;
    this.world = new World(CANVAS.BASE_HEIGHT, this.seed); // pre-create for title screen backdrop
    this.obstacles = null;
    this.score = 0;
    this.obstaclesDestroyed = 0;
    this.antiCheat = null;
    this.finalRunResult = null;

    // Start the loop
    this._climbingUp = false;
    this._climbTarget = null;
    this._boundLoop = this._loop.bind(this);
    requestAnimationFrame(this._boundLoop);
  }

  /**
   * Start or restart the game.
   */
  start() {
    setStartButtonVisible(false);
    this.seed = Math.floor(Math.random() * 1000000);

    this.player = new Player(PLAYER.START_X, CANVAS.BASE_HEIGHT - PLAYER.START_Y_OFFSET);
    this.rope = new RopeSystem();
    this.world = new World(CANVAS.BASE_HEIGHT, this.seed);
    this.obstacles = new ObstacleManager(this.seed);
    this.buildingSnipers = new BuildingSniperManager();
    this.enemyNinjas = new EnemyNinjaManager();
    this.angelEnemies = new AngelEnemyManager();
    this.antiCheat = new AntiCheatRun(this.seed);
    this.finalRunResult = null;

    this.score = 0;
    this.obstaclesDestroyed = 0;
    this.timeRemaining = TIMER.START_TIME_MS;
    this.hookTimer = 0;
    this.releaseGuard = 0;
    this.ui.displayedScore = 0;
    this.ui.floatingTexts = [];
    this.particles = new ParticleSystem();

    this.camera.x = 0;
    this.camera.y = 0;

    // Start on the first platform, aiming
    this.player.state = PlayerState.STANDING;
    this.rope.startAiming();

    this.state = GameState.PLAYING;
    this.gameOverDelay = 0;

    // Init and start music on first game start
    audio.init();
    audio.startMusic();
  }

  _onRawInput(evt) {
    if (this.state !== GameState.PLAYING || !this.antiCheat) return;
    this.antiCheat.recordInput(evt.type, evt.code, evt.time);
  }

  /**
   * Main game loop.
   */
  _loop(timestamp) {
    // Delta time with cap — dtFactor normalizes to 60fps
    const dt = this.lastTime === 0 ? 16.667 : Math.min(timestamp - this.lastTime, 50);
    this.lastTime = timestamp;

    // Poll gamepad inputs
    this.input.pollGamepad();

    // Update
    this._update(dt);

    // Render
    this._render(dt);

    // Clear single-frame input states
    this.input.endFrame();

    // Continue loop
    requestAnimationFrame(this._boundLoop);
  }

  /**
   * Update game logic.
   */
  _update(dt) {
    try {
      switch (this.state) {
        case GameState.TITLE:
          this._updateTitle(dt);
          break;
        case GameState.PLAYING:
          this._updatePlaying(dt);
          break;
        case GameState.GAME_OVER:
          this._updateGameOver(dt);
          break;
      }
    } catch (e) {
      console.error('Game update error:', e);
    }
  }

  _updateTitle(dt) {
    setStartButtonVisible(true);
    if (this.input.wasSpacePressed() || this.input.wasHookPressed()) {
      swingBladeInputDebug('title-consumed-space-start', {
        state: this.state,
        spaceDown: this.input.isDown('Space'),
        spaceJustPressed: this.input.wasPressed('Space'),
      });
      audio.stopMenuDrone();
      this.start();
    }
  }

  _updatePlaying(dt) {
    const player = this.player;
    const rope = this.rope;
    rope._dtF = dt / 16.667; // pass dt factor for aim sweep scaling

    // Feed down-key state every frame so Super Jump charging works instantly on ground or in air
    player.downHeld = this.input.isDown('ArrowDown') || this.input.isDown('KeyS');

    // Calculate difficulty factor (0 to 1)
    const difficulty = this._getDifficulty();

    // --- Player State Machine ---

    switch (player.state) {
      case PlayerState.STANDING:
        // Move left/right on platform
        player.moveInput = this.input.getHorizontal();

        // Jump (Space / Up arrow / W) - no hook from ground
        if (this.input.wasSpacePressed() || this.input.wasPressed('ArrowUp') || this.input.wasPressed('KeyW')) {
          player.jumpRequested = true;
          audio.playJump();
        }

        // Check if player walked off the platform edge
        const currentPlatform = this.world.checkPlatformLanding(
          player.x, player.y + PLAYER.HEIGHT / 2 + 2, PLAYER.WIDTH, 1
        );
        if (!currentPlatform) {
          // Walked off edge - fall!
          player.state = PlayerState.AIRBORNE;
          player.moveInput = 0;
          rope.cancel();
          break;
        }

        // If rope is traveling (fired while airborne, landed before it hit),
        // keep updating it - hook should still connect
        if (rope.state === RopeState.TRAVELING) {
          const arrived = rope.updateTraveling(dt);
          if (arrived) {
            rope.attach(player.x, player.y, player.vx || 0, player.vy || 0);
            player.state = PlayerState.SWINGING;
            this.hookTimer = 0; // reset hook time limit
            this.particles.grappleAttach(rope.anchorX, rope.anchorY);
            audio.playHookAttach();
          }
        } else {
          // Aim indicator always sweeps - even while standing
          rope.updateAim(difficulty);
        }
        break;

      case PlayerState.GRAPPLING:
        // Legacy state - redirect to airborne (hook traveling handled there)
        player.state = PlayerState.AIRBORNE;
        break;

      case PlayerState.SWINGING:
        // Track hook time
        if (!this.hookTimer) this.hookTimer = 0;
        this.hookTimer += dt;

        // Flash red when running out of hook time
        const currentHookLimit = rope.hookedBird ? 5000 : ROPE.HOOK_TIME_LIMIT_MS;
        const hookTimeLeft = currentHookLimit - this.hookTimer;
        player.hookWarning = hookTimeLeft <= ROPE.HOOK_WARNING_MS && hookTimeLeft > 0;

        // Tick swing input delay - no player momentum agency for first 3 seconds
        if (rope.swingInputDelay > 0) rope.swingInputDelay -= dt;

        // Get player swing input (blocked during delay - only climb allowed)
        const swingInput = rope.swingInputDelay <= 0 ? this.input.getHorizontal() : 0;
        const climbInput = this.input.getVertical();

        // Update rope physics (left/right swing + up/down climb)
        const newPos = rope.updateSwing(swingInput, climbInput, dt);
        if (newPos) {
          player.x = newPos.x;
          player.y = newPos.y;
        }

        // Climb onto platform - rope must be short, climbing up, and relatively still
        const swingStill = Math.abs(rope.angularVelocity) < 0.015;
        if (!rope.hookedBird && rope.ropeLength <= ROPE.MIN_LENGTH + 8 && climbInput < 0 && swingStill) {
          const landPlat = this.world.checkPlatformLanding(
            rope.anchorX, rope.anchorY + 5, PLAYER.WIDTH, 20
          );
          if (landPlat) {
            // Smooth climb-up: lerp player to platform over a few frames
            if (!this._climbingUp) {
              this._climbingUp = true;
              this._climbTarget = { x: rope.anchorX, y: landPlat.y - PLAYER.HEIGHT / 2, plat: landPlat };
            }
          }
        }
        if (this._climbingUp && this._climbTarget) {
          const t = this._climbTarget;
          const lerpSpeed = 0.15;
          player.x += (t.x - player.x) * lerpSpeed;
          player.y += (t.y - player.y) * lerpSpeed;
          // Close enough - land
          if (Math.abs(player.y - t.y) < 2 && Math.abs(player.x - t.x) < 2) {
            rope.cancel();
            player.land(t.plat.y, t.plat);
            this.hookTimer = 0;
            player.hookWarning = false;
            this._climbingUp = false;
            this._climbTarget = null;
            break;
          }
        }

        // Check if a red bird flies through the rope (cuts it)
        for (const obs of this.obstacles.obstacles) {
          if (!obs.alive || !obs.isRedBird) continue;
          // Line segment: anchor to player
          const ax = rope.anchorX, ay = rope.anchorY;
          const bx = player.x, by = player.y;
          // Point: bird position
          const cx = obs.x, cy = obs.y;
          // Distance from point to line segment
          const abx = bx - ax, aby = by - ay;
          const acx = cx - ax, acy = cy - ay;
          const ab2 = abx * abx + aby * aby;
          if (ab2 > 0) {
            const t = Math.max(0, Math.min(1, (acx * abx + acy * aby) / ab2));
            const nearX = ax + t * abx, nearY = ay + t * aby;
            const dist = Math.sqrt((cx - nearX) ** 2 + (cy - nearY) ** 2);
            if (dist < obs.size * 0.8) {
              // Red bird cuts the rope — same as pressing Space
              if (rope.hookedBird) { rope.hookedBird.frozen = false; rope.hookedBird = null; }
              const cutVel = rope.release();
              if (cutVel) {
                cutVel.vy -= 1.2;
                if (cutVel.vy < -8) cutVel.vy = -8;
                player.launch(cutVel.vx, cutVel.vy);
                this.particles.ropeRelease(player.x, player.y, cutVel.vx, cutVel.vy);
              }
              this.hookTimer = 0;
              player.hookWarning = false;
              this.releaseGuard = 150;
              this._climbingUp = false;
              this._climbTarget = null;
              rope.startAiming(true);
              break;
            }
          }
        }

        // Update aim indicator while swinging - so you can plan your next move
        rope.updateAimWhileAttached(difficulty);

        // Release rope on Space OR auto-release when time runs out
        // Birds have a shorter hook limit (5s vs normal 9s)
        const effectiveHookLimit = rope.hookedBird ? 5000 : ROPE.HOOK_TIME_LIMIT_MS;
        if (this.input.wasSpacePressed() || this.hookTimer >= effectiveHookLimit) {
          // Unfreeze hooked bird on release
          if (rope.hookedBird) {
            rope.hookedBird.frozen = false;
            rope.hookedBird = null;
          }
          const launchVel = rope.release();
          if (launchVel) {
            launchVel.vy -= 1.32; // 10% bigger upward boost on hook release
            // Cap vertical launch so swings don't send you too high
            if (launchVel.vy < -8) launchVel.vy = -8;
            player.launch(launchVel.vx, launchVel.vy);
            this.particles.ropeRelease(player.x, player.y, launchVel.vx, launchVel.vy);
          }
          this.hookTimer = 0;
          player.hookWarning = false;
          this.releaseGuard = 150; // ms cooldown before blade can trigger
          this._climbingUp = false;
          this._climbTarget = null;
          rope.startAiming(true); // restart aim from left side after release
          audio.playRelease();
        }
        break;

      case PlayerState.AIRBORNE:
        // Player physics handled in player.update()
        player.moveInput = this.input.getHorizontal();

        // Aim indicator sweeps while airborne - so you can time your shot
        if (rope.state === RopeState.IDLE) {
          rope.startAiming();
        }
        if (rope.state === RopeState.AIMING) {
          rope.updateAim(difficulty);
        }

        // Fire grappling hook while airborne (C key)
        if (this.input.wasHookPressed() && rope.state === RopeState.AIMING) {
          const aimDir = rope.fireHook(player.x, player.y);
          audio.playHookFire();
          if (aimDir) {
            // Find anchor in aim direction (platforms + birds)
            const anchor = this.world.findNearestAnchor(
              player.x, player.y, aimDir.dirX, aimDir.dirY, 500, this.obstacles.obstacles
            );
            if (anchor) {
              rope.setTarget(anchor.x, anchor.y);
              // If hooking a bird, freeze it and store ref
              if (anchor.birdRef) {
                rope.hookedBird = anchor.birdRef;
                anchor.birdRef.frozen = true;
              } else {
                rope.hookedBird = null;
              }
              // Track if we hooked a building edge (triggers sniper)
            }
            // Hook fires along aim direction either way -
            // if no anchor, it'll fly out and retract (miss)
            // STAY AIRBORNE - keep falling until hook arrives
          }
        }

        // If hook is traveling while we're airborne, check if it arrived
        if (rope.state === RopeState.TRAVELING) {
          const arrived = rope.updateTraveling(dt);
          if (arrived) {
            rope.attach(player.x, player.y, player.vx, player.vy);
            player.state = PlayerState.SWINGING;
            this.hookTimer = 0; // reset hook time limit
            this.particles.grappleAttach(rope.anchorX, rope.anchorY);
            audio.playHookAttach();
          }
        }

        // Check platform landing
        const platform = this.world.checkPlatformLanding(
          player.x,
          player.y + PLAYER.HEIGHT / 2,
          PLAYER.WIDTH,
          player.vy
        );
        if (platform && player.vy > 0) {
          player.land(platform.y, platform);
          // Don't reset aim - keep it sweeping continuously
          this.particles.landingDust(player.x, platform.y);
          audio.playLand();
        }

        // Bounce off skyscrapers - solid walls, not instant death
        const hitSky = this.world.checkSkyscraperCollision(player.x, player.y, PLAYER.WIDTH, PLAYER.HEIGHT);
        if (hitSky) {
          // Push player back out and reverse horizontal velocity
          const skyCenterX = hitSky.x + hitSky.width / 2;
          if (player.x < skyCenterX) {
            player.x = hitSky.x - PLAYER.WIDTH / 2 - 2;
          } else {
            player.x = hitSky.x + hitSky.width + PLAYER.WIDTH / 2 + 2;
          }
          player.vx = -player.vx * 0.6;
          player.vy *= 0.5;
          this.ui.shake(6, 200);
          this.particles.bladeHitSparks(player.x, player.y);
          audio.playBounce();

          // Skyscraper wall bounce triggers sniper fire!
          this.buildingSnipers.triggerFire(hitSky.x + hitSky.width / 2, hitSky.y, player);

          // Cancel rope if it was traveling
          if (rope.state === RopeState.TRAVELING) {
            rope.cancel();
          }
        }

        // Building collision - bounce off sides (same as skyscrapers)
        const hitBuilding = this.world.checkBuildingCollision(player.x, player.y, PLAYER.WIDTH, PLAYER.HEIGHT);
        if (hitBuilding && player.state !== PlayerState.STANDING) {
          const bCenterX = hitBuilding.x + hitBuilding.width / 2;
          if (player.x < bCenterX) {
            player.x = hitBuilding.x - PLAYER.WIDTH / 2 - 2;
          } else {
            player.x = hitBuilding.x + hitBuilding.width + PLAYER.WIDTH / 2 + 2;
          }
          player.vx = -player.vx * 0.6;
          player.vy *= 0.5;
          this.ui.shake(6, 200);
          this.particles.bladeHitSparks(player.x, player.y);
          audio.playBounce();
          if (rope.state === RopeState.TRAVELING) {
            rope.cancel();
          }
        }

        // Check death: hit the ground (SPLAT!) - super jump saves you!
        if (this.world.checkGroundCollision(player.y, PLAYER.HEIGHT)) {
          if (player.superJumpReady) {
            // Auto-trigger super jump to save from death!
            player.y = this.world.getGroundY() - PLAYER.HEIGHT / 2 - 5;
            player.vy = -12; // launch straight up
            player.vx = player.facingRight ? 4 : -4; // slight forward momentum
            player.state = PlayerState.AIRBORNE;
            player.superJumpReady = false;
            player.superJumpCharging = false;
            player.superJumpChargeTime = 0;
            player.superJumpCharged = false;
            player.airBladeHits = 0;
            this.particles.bladeHitSparks(player.x, player.y);
            this.particles.bladeHitSparks(player.x, player.y);
            this.ui.shake(6, 300);
          } else {
            player.y = this.world.getGroundY() - PLAYER.HEIGHT / 2;
            this.particles.deathExplosion(player.x, this.world.getGroundY());
            this.ui.shake(10, 400);
            this._gameOver();
            return;
          }
        }
        break;
    }

    // --- Blade Attack (Space or mouse click) ---
    // Only works while airborne - can't attack while standing, hooked in, or just released
    if (this.releaseGuard > 0) this.releaseGuard -= dt;
    if (this.input.wasBladeTriggered() && player.state === PlayerState.AIRBORNE && this.releaseGuard <= 0) {
      player.tryBlade();
      rope.startAiming(true); // restart aim from left after blade attack
      audio.playBlade();
    }

    // Blade trail particles
    if (player.bladeActive) {
      this.particles.bladeTrail(player.x, player.y, player.facingRight);
    }

    // Check blade hits on obstacles
    if (player.bladeActive) {
      try {
        const hitbox = player.getBladeHitbox();
        if (hitbox) {
          // Check blade hits on enemy ninjas
          const ninjaResult = this.enemyNinjas.checkBladeHits(hitbox);
          for (const nk of ninjaResult.kills) {
            player.onBladeHit('drone'); // ninja kill = drone-level bounce
            this.score += 200;
            audio.playKill();
            this.obstaclesDestroyed++;
            this.particles.bladeHitSparks(nk.x, nk.y);
            this.particles.obstacleDestroy(nk.x, nk.y, '#ffffff');
            this.ui.addFloatingText('NINJA!', nk.x, nk.y - 20, '#ffffff');
            this.ui.shake(10, 300);
          }
          for (const nk of ninjaResult.clashes) {
            // Both bounce — bird-style
            player.onBladeHit('bird');
            this.particles.bladeHitSparks(nk.x, nk.y);
            this.ui.addFloatingText('CLASH!', nk.x, nk.y - 20, '#ffffff');
            audio.playClash();
            this.ui.shake(8, 200);
          }

          if (this.angelEnemies.checkBladeClash(hitbox)) {
            player.onBladeHit('bird');
            this.particles.bladeHitSparks(player.x, player.y);
            this.ui.addFloatingText('ANGEL CLASH!', player.x, player.y - 28, '#ffd76a');
            audio.playClash();
            this.ui.shake(9, 220);
          }

          const hits = this.obstacles.checkBladeHits(hitbox);
          if (hits && hits.length > 0) {
            // Apply blade hit once - use the best enemy type for boost
            const hasM = hits.some(h => h && h.type === 'missile');
            const hasD = hits.some(h => h && h.type === 'drone');
            const bestType = hasM ? 'missile' : hasD ? 'drone' : 'bird';
            player.onBladeHit(bestType);
            this.obstaclesDestroyed += hits.length;
            audio.playKill();

            for (const hit of hits) {
              if (!hit) continue;
              const hx = hit.x || 0;
              const hy = hit.y || 0;
              const isBird = hit.type === 'bird';
              const isDrone = hit.type === 'drone';

              // Particle effects
              this.particles.bladeHitSparks(hx, hy);
              this.particles.obstacleDestroy(hx, hy,
                isBird ? '#ff8866' :
                isDrone ? '#8888ff' : '#ff4444'
              );

              if (isBird) {
                // Birds = jump boost only, no score, no time
                this.ui.addFloatingText('BOOST!', hx, hy - 20, '#88ff88');
              } else if (isDrone) {
                // Drones = score + time bonus
                const bonus = SCORING.OBSTACLE_KILL_BONUS || 200;
                this.score += bonus;
                this.ui.addFloatingText('+' + bonus, hx, hy - 20, '#8888ff');
                this.ui.shake(8, 250);
              } else {
                // Missiles = score
                const bonus = Math.floor((SCORING.OBSTACLE_KILL_BONUS || 200) * 1.5);
                this.score += bonus;
                this.ui.addFloatingText('+' + bonus, hx, hy - 20, '#ff4444');
                this.ui.shake(6, 200);
              }
            }
          }
        }
      } catch (e) {
        console.warn('Blade hit error:', e);
      }
    }

    // Speed lines when moving fast
    if (player.state === PlayerState.AIRBORNE || player.state === PlayerState.SWINGING) {
      this.particles.speedLines(player.x, player.y, player.vx, player.vy);
    }

    // Ambient city particles
    this.particles.ambientMote(this.camera.x, this.camera.y, CANVAS.BASE_WIDTH, CANVAS.BASE_HEIGHT);

    // Check player collision with obstacles (death)
    if (player.state !== PlayerState.DEAD) {
      const collision = this.obstacles.checkPlayerCollision(
        player.x, player.y, PLAYER.WIDTH, PLAYER.HEIGHT
      );
      if (collision) {
        this._gameOver();
        return;
      }

      // Enemy ninja blade kills player (only if player is NOT blading — clashes handled above)
      if (!player.bladeActive && this.enemyNinjas.checkPlayerHit(player.x, player.y)) {
        this.particles.deathExplosion(player.x, player.y);
        this.ui.shake(12, 500);
        this._gameOver();
        return;
      }
    }

    // --- Update Systems ---
    player.update(dt);

    // Super Jump launch - player flagged it, we provide aim direction
    if (player.superJumpLaunch) {
      const superForce = 12; // powerful but not orbital
      player.vx = Math.cos(rope.aimAngle) * superForce;
      player.vy = Math.sin(rope.aimAngle) * superForce;
      player.state = PlayerState.AIRBORNE;
      player.currentPlatform = null;
      player.superJumpLaunch = false;
      player.superJumpReady = false;
      player.superJumpCharging = false;
      player.superJumpChargeTime = 0;
      player.superJumpCharged = false;
      player.airBladeHits = 0;
      this.particles.bladeHitSparks(player.x, player.y);
      this.particles.bladeHitSparks(player.x, player.y);
    }

    this.particles.update(dt);

    // Distance-based score
    this.score = Math.max(this.score,
      Math.floor(player.distanceTraveled * SCORING.DISTANCE_MULTIPLIER) +
      this.obstaclesDestroyed * SCORING.OBSTACLE_KILL_BONUS
    );

    // Update camera
    this.camera.update(player.x, player.y, CANVAS.BASE_HEIGHT);

    // Update world generation
    this.world.update(this.camera.x);

    // Update obstacles
    this.obstacles.update(dt, this.camera.x, player.x, player.y, player.distanceTraveled, this.world);
    this.buildingSnipers.update(dt);
    // Building sniper bullets kill on contact (can't be bladed)
    if (this.buildingSnipers.checkPlayerHit(player.x, player.y, PLAYER.WIDTH, PLAYER.HEIGHT)) {
      this.particles.deathExplosion(player.x, player.y);
      this.ui.shake(12, 500);
      this._gameOver();
    }

    // Update enemy ninjas
    this.enemyNinjas.update(dt, player.x, player.y, this.world, this.camera.x);

    // Cloud-only angel pressure
    this.angelEnemies.update(dt, player);
    if (!player.bladeActive && this.angelEnemies.checkPlayerHit(player.x, player.y)) {
      this.particles.deathExplosion(player.x, player.y);
      this.ui.shake(12, 500);
      this._gameOver();
      return;
    }

    // Timer disabled - death only from falling or bullets
    // if (player.state !== PlayerState.DEAD) {
    //   this.timeRemaining -= dt;
    //   if (this.timeRemaining <= 0) {
    //     this.timeRemaining = 0;
    //     this.particles.deathExplosion(player.x, player.y);
    //     this.ui.shake(10, 400);
    //     this._gameOver();
    //   }
    // }

    // Update UI
    this.ui.update(dt, this.score);
  }

  _updateGameOver(dt) {
    this.gameOverDelay -= dt;
    if (this.gameOverDelay <= 0 && (this.input.wasSpacePressed() || this.input.wasHookPressed())) {
      this.start();
    }
  }

  _gameOver() {
    this.finalRunResult = this._finalizeRunResult();
    this.player.die();
    this.state = GameState.GAME_OVER;
    audio.playDeath();
    audio.stopMusic();
    this.gameOverDelay = 1000; // 1 second delay before restart allowed

    // Send score to parent window (ICP Arcade integration)
    this._postScore();
  }

  _finalizeRunResult() {
    const rawDistance = Math.max(0, Math.floor(this.player ? this.player.distanceTraveled : 0));
    const rawScore = Math.max(0, Math.floor(this.score));
    const antiCheat = this.antiCheat ? this.antiCheat.finalize() : {
      verdict: 'clean',
      suspicionScore: 0,
      flags: [],
      metrics: {},
      runDurationMs: 0,
      totalInputs: 0,
    };

    let effectiveDistance = rawDistance;
    let effectiveScore = rawScore;
    let message = null;

    if (antiCheat.verdict === 'robotic') {
      effectiveDistance = 1;
      effectiveScore = 1;
      message = 'Automation detected. This run was invalidated.';
    } else if (antiCheat.verdict === 'suspicious') {
      message = 'Suspicious activity detected. Your account is under review.';
    }

    return {
      ...antiCheat,
      rawDistance,
      rawScore,
      effectiveDistance,
      effectiveScore,
      message,
    };
  }

  /**
   * Post score to ICP Arcade via postMessage (iframe integration).
   */
  _postScore() {
    try {
      const runResult = this.finalRunResult || this._finalizeRunResult();
      const finalScore = runResult.effectiveScore;
      const metadata = {
        game: 'swing-blade',
        score: finalScore,
        distance: runResult.effectiveDistance,
        obstaclesDestroyed: this.obstaclesDestroyed,
        seed: this.seed,
        antiCheat: {
          verdict: runResult.verdict,
          suspicionScore: runResult.suspicionScore,
          flags: runResult.flags,
          metrics: runResult.metrics,
          runDurationMs: runResult.runDurationMs,
          totalInputs: runResult.totalInputs,
          rawDistance: runResult.rawDistance,
          rawScore: runResult.rawScore,
        },
      };

      if (window.parent !== window) {
        // GAME_OVER — tells arcade the session ended
        window.parent.postMessage({ type: 'GAME_OVER', ...metadata }, '*');

        // SUBMIT_SCORE — some arcade flows use this for ticket payout
        window.parent.postMessage({ type: 'SUBMIT_SCORE', score: finalScore, ...metadata }, '*');
      }

      console.log('[Arcade] Score submitted:', finalScore, metadata);
    } catch (e) {
      console.warn('Could not post score:', e);
    }
  }

  /**
   * Get current difficulty factor (0 to 1).
   */
  _getDifficulty() {
    if (!this.player) return 0;
    const dist = this.player.distanceTraveled;
    if (dist < DIFFICULTY.RAMP_START) return 0;
    return Math.min(1, (dist - DIFFICULTY.RAMP_START) / (DIFFICULTY.RAMP_END - DIFFICULTY.RAMP_START));
  }

  /**
   * Render everything.
   */
  _render(dt) {
    const ctx = this.ctx;

    // Screen shake
    const shake = this.ui.getShakeOffset(dt);

    ctx.save();
    ctx.translate(shake.x, shake.y);

    // Clip to canvas bounds to prevent off-screen drawing artifacts
    ctx.beginPath();
    ctx.rect(0, 0, CANVAS.BASE_WIDTH, CANVAS.BASE_HEIGHT);
    ctx.clip();

    // Clear and draw background
    this.camera.drawBackground(ctx);

    if (this.state === GameState.TITLE) {
      this.ui.drawTitleScreen(ctx);
    } else {
      try {
      // Draw world
      this.world.draw(ctx, this.camera.x, this.camera.y);

      // Draw obstacles
      this.obstacles.draw(ctx, this.camera.x, this.camera.y);
      this.buildingSnipers.draw(ctx, this.camera.x, this.camera.y);

      // Draw enemy ninjas
      this.enemyNinjas.draw(ctx, this.camera.x, this.camera.y, this.spriteManager);
      this.angelEnemies.draw(ctx, this.camera.x, this.camera.y);

      // Draw particles (behind player)
      this.particles.draw(ctx, this.camera.x, this.camera.y);

      // Draw rope/hook/aim
      this.rope.draw(ctx, this.camera.x, this.camera.y, this.player.x, this.player.y, this.player.bladeActive);

      // Draw player
      this.player.draw(ctx, this.camera.x, this.camera.y, this.spriteManager);

      // Draw floating texts
      this.ui.drawFloatingTexts(ctx, this.camera.x, this.camera.y);

      // Draw HUD
      const comboMultiplier = 1 + (this.player.comboCount - 1) * SCORING.COMBO_MULTIPLIER_INCREMENT;
      const sjMode = this.player.superJumpCharged ? 'charged'
        : this.player.superJumpCharging ? 'charging'
        : this.player.superJumpReady ? 'available' : null;
      const sjState = sjMode ? {
        mode: sjMode,
        used: this.player.superJumpsEarned,
        max: BLADE.SUPER_JUMP_MAX_EARNED,
      } : null;
      this.ui.drawHUD(
        ctx,
        this.player.distanceTraveled,
        this.player.comboCount,
        comboMultiplier,
        null,
        sjState
      );

      // Game over overlay - delay appearance so explosion plays out
      if (this.state === GameState.GAME_OVER) {
        const result = this.finalRunResult || {
          effectiveDistance: this.player.distanceTraveled,
          effectiveScore: this.score,
          message: null,
          verdict: 'clean',
        };
        this.ui.drawGameOver(ctx, result.effectiveDistance, result.effectiveScore, result);
      }
      } catch (e) {
        console.warn('Render error:', e);
      }
    }

    ctx.restore();
  }

  /**
   * Clean up the game.
   */
  destroy() {
    this.input.destroy();
  }
}

const canvas = document.getElementById('gameCanvas');
canvas.setAttribute('tabindex', '0');
setTimeout(focusGameInput, 0);
const game = new Game(canvas);
window.swingBladeGame = game;
const startButton = document.getElementById('startButton');
if (startButton) {
  startButton.addEventListener('click', handleStartButtonClick);
  startButton.addEventListener('touchstart', handleStartButtonClick, { passive: false });
  setStartButtonVisible(game.state === GameState.TITLE);
}
window.__swingBladeApplyArcadeKey = (data) => {
  if (!game || !game.input) {
    swingBladeInputDebug('apply-wrapper-no-game', { action: data && data.action, state: data && data.state });
    return false;
  }
  const result = game.input.applyArcadeAction(data.action, data.state);
  swingBladeInputDebug('apply-wrapper-result', {
    action: data.action,
    state: data.state,
    result,
    gameState: game.state,
    spaceDown: game.input.isDown('Space'),
    spaceJustPressed: game.input.wasPressed('Space'),
  });
  return result;
};
notifyArcadeInputReady('apply-hook-ready');
setTimeout(() => notifyArcadeInputReady('apply-hook-ready-tick'), 0);

window.addEventListener('resize', () => {});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
  </script>
