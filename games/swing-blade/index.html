      this.climbEnergy = Math.min(this.maxClimbEnergy, this.climbEnergy + 0.08 * dtF);
    }

    // Apply damping — frame-rate independent
    this.angularVelocity *= Math.pow(ROPE.DAMPING, dtF);

    // Cap angular velocity - prevents full rotation without proper pendulum buildup
    const maxAV = ROPE.MAX_ANGULAR_VELOCITY;
    if (maxAV) {
      if (this.angularVelocity > maxAV) this.angularVelocity = maxAV;
      if (this.angularVelocity < -maxAV) this.angularVelocity = -maxAV;
    }

    // Update angle
    this.angle += this.angularVelocity * dtF;

    // Calculate player position on the rope
    const playerX = this.anchorX + Math.sin(this.angle) * this.ropeLength;
    const playerY = this.anchorY + Math.cos(this.angle) * this.ropeLength;

    return { x: playerX, y: playerY };
  }

  /**
   * Release the rope and calculate launch velocity.
   * Combines tangential swing velocity + any climbing velocity.
   */
  release() {
    if (this.state !== RopeState.ATTACHED) return null;

    // Tangential velocity from swinging
    const tangentialSpeed = this.angularVelocity * this.ropeLength;
    let vx = tangentialSpeed * Math.cos(this.angle) * ROPE.LAUNCH_MULTIPLIER;
    let vy = tangentialSpeed * -Math.sin(this.angle) * ROPE.LAUNCH_MULTIPLIER;

    // Add climbing momentum - accumulated climb energy launches upward along rope
    if (this.climbEnergy > 0) {
      // Boost toward anchor (upward along rope)
      vx += Math.sin(this.angle) * this.climbEnergy * -1;
      vy += Math.cos(this.angle) * this.climbEnergy * -1;
    }

    this.state = RopeState.IDLE;
    this.lastClimbInput = 0;
    this.climbEnergy = 0;

    return { vx, vy };
  }

  /**
   * Cancel/detach rope without launching (e.g., hook missed).
   */
  cancel() {
    this.state = RopeState.IDLE;
    this.angularVelocity = 0;
  }

  /**
   * Get current player position while swinging (for external use).
   */
  getPlayerPosition() {
    if (this.state !== RopeState.ATTACHED) return null;
    return {
      x: this.anchorX + Math.sin(this.angle) * this.ropeLength,
      y: this.anchorY + Math.cos(this.angle) * this.ropeLength,
    };
  }

  /**
   * Draw the rope, hook, aim indicator, etc.
   */
  draw(ctx, cameraX, cameraY, playerX, playerY, bladeActive) {
    ctx.save();

    // Hide ALL aim visuals during blade slash
    if (!bladeActive && this.state === RopeState.AIMING) {
      this._drawAimIndicator(ctx, cameraX, cameraY, playerX, playerY);
    }

    if (this.state === RopeState.TRAVELING) {
      this._drawTravelingHook(ctx, cameraX, cameraY, playerX, playerY);
    }

    if (this.state === RopeState.ATTACHED) {
      this._drawRope(ctx, cameraX, cameraY, playerX, playerY);
      this._drawAnchor(ctx, cameraX, cameraY);
      // Aimer hidden while hooked in
    }

    ctx.restore();
  }

  _drawAimIndicator(ctx, cameraX, cameraY, playerX, playerY) {
    const screenX = playerX - cameraX;
    const screenY = playerY - cameraY;

    const endX = screenX + Math.cos(this.aimAngle) * AIM.AIM_LINE_LENGTH;
    const endY = screenY + Math.sin(this.aimAngle) * AIM.AIM_LINE_LENGTH;

    // Dashed line
    ctx.setLineDash([8, 6]);
    ctx.strokeStyle = COLORS.AIM_LINE;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(screenX, screenY);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    // Crosshair at end
    ctx.setLineDash([]);
    ctx.strokeStyle = COLORS.AIM_LINE;
    ctx.lineWidth = 1.5;
    const crossSize = 8;
    ctx.beginPath();
    ctx.moveTo(endX - crossSize, endY);
    ctx.lineTo(endX + crossSize, endY);
    ctx.moveTo(endX, endY - crossSize);
    ctx.lineTo(endX, endY + crossSize);
    ctx.stroke();
  }

  _drawTravelingHook(ctx, cameraX, cameraY, playerX, playerY) {
    const screenPlayerX = playerX - cameraX;
    const screenPlayerY = playerY - cameraY;
    const screenHookX = this.hookX - cameraX;
    const screenHookY = this.hookY - cameraY;

    // Line from player to hook
    ctx.strokeStyle = COLORS.ROPE;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.moveTo(screenPlayerX, screenPlayerY);
    ctx.lineTo(screenHookX, screenHookY);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Hook head
    ctx.fillStyle = COLORS.ANCHOR_POINT;
    ctx.beginPath();
    ctx.arc(screenHookX, screenHookY, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  _drawRope(ctx, cameraX, cameraY, playerX, playerY) {
    const screenPlayerX = playerX - cameraX;
    const screenPlayerY = playerY - cameraY;
    const screenAnchorX = this.anchorX - cameraX;
    const screenAnchorY = this.anchorY - cameraY;

    // Rope line with slight curve
    ctx.strokeStyle = COLORS.ROPE;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(screenAnchorX, screenAnchorY);

    // Add a slight sag to the rope for visual appeal
    const midX = (screenAnchorX + screenPlayerX) / 2;
    const midY = (screenAnchorY + screenPlayerY) / 2 + 10; // slight sag
    ctx.quadraticCurveTo(midX, midY, screenPlayerX, screenPlayerY);
    ctx.stroke();
  }

  _drawSwingAim(ctx, cameraX, cameraY, playerX, playerY) {
    const screenX = playerX - cameraX;
    const screenY = playerY - cameraY;

    const endX = screenX + Math.cos(this.swingAimAngle) * AIM.AIM_LINE_LENGTH;
    const endY = screenY + Math.sin(this.swingAimAngle) * AIM.AIM_LINE_LENGTH;

    // Full brightness - same as standing/airborne aim
    ctx.setLineDash([6, 5]);
    ctx.strokeStyle = COLORS.AIM_LINE;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(screenX, screenY);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    // Crosshair - full brightness
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.8;
    const crossSize = 6;
    ctx.beginPath();
    ctx.moveTo(endX - crossSize, endY);
    ctx.lineTo(endX + crossSize, endY);
    ctx.moveTo(endX, endY - crossSize);
    ctx.lineTo(endX, endY + crossSize);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  _drawAnchor(ctx, cameraX, cameraY) {
    const screenX = this.anchorX - cameraX;
    const screenY = this.anchorY - cameraY;

    // Anchor glow
    ctx.fillStyle = 'rgba(255, 170, 0, 0.3)';
    ctx.beginPath();
    ctx.arc(screenX, screenY, 10, 0, Math.PI * 2);
    ctx.fill();

    // Anchor point
    ctx.fillStyle = COLORS.ANCHOR_POINT;
    ctx.beginPath();
    ctx.arc(screenX, screenY, 5, 0, Math.PI * 2);
    ctx.fill();
  }
}


// ===== world.js =====
// ============================================================
// Swing Blade - World Generation
// ============================================================
// Procedurally generates the cityscape: buildings, platforms,
// anchor points, and manages cleanup of off-screen elements.
// Uses seeded random for deterministic generation.
// ============================================================


/**
 * Simple seeded pseudo-random number generator (mulberry32).
 * Deterministic: same seed = same world = anti-cheat friendly.
 */
class SeededRandom {
  constructor(seed) {
    this.state = seed;
  }

  /** Returns a float between 0 and 1. */
  next() {
    this.state |= 0;
    this.state = this.state + 0x6D2B79F5 | 0;
    let t = Math.imul(this.state ^ this.state >>> 15, 1 | this.state);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }

  /** Returns an integer between min (inclusive) and max (inclusive). */
  nextInt(min, max) {
    return Math.floor(this.next() * (max - min + 1)) + min;
  }

  /** Returns a float between min and max. */
  nextFloat(min, max) {
    return this.next() * (max - min) + min;
  }
}

class Building {
  constructor(x, width, height, canvasHeight) {
    this.x = x;
    this.width = width;
    this.height = height;
    this.y = canvasHeight - height; // top of building (y goes down)
    this.canvasHeight = canvasHeight;

    // Visual: window grid
    this.windowCols = Math.floor(width / 25);
    this.windowRows = Math.floor(height / 30);
    this.windowStates = []; // true = lit, false = dark

    // Generate random window lights
    for (let i = 0; i < this.windowCols * this.windowRows; i++) {
      this.windowStates.push(Math.random() > 0.4);
    }

    // Anchor points on this building
    this.anchors = [];
  }

  draw(ctx, cameraX, cameraY) {
    const screenX = this.x - cameraX;
    const screenY = this.y - cameraY;

    // Skip if off screen
    if (screenX + this.width < -50 || screenX > CANVAS.BASE_WIDTH + 50) return;

    // Building body
    ctx.fillStyle = COLORS.BUILDING_MID;
    ctx.fillRect(screenX, screenY, this.width, this.height);

    // Building outline
    ctx.strokeStyle = COLORS.BUILDING_LIGHT;
    ctx.lineWidth = 1;
    ctx.strokeRect(screenX, screenY, this.width, this.height);

    // Windows
    const windowWidth = 10;
    const windowHeight = 14;
    const paddingX = (this.width - this.windowCols * 25) / 2 + 8;
    const paddingY = 15;

    for (let row = 0; row < this.windowRows; row++) {
      for (let col = 0; col < this.windowCols; col++) {
        const idx = row * this.windowCols + col;
        const wx = screenX + paddingX + col * 25;
        const wy = screenY + paddingY + row * 30;

        ctx.fillStyle = this.windowStates[idx]
          ? COLORS.BUILDING_WINDOW
          : COLORS.BUILDING_WINDOW_OFF;
        ctx.globalAlpha = this.windowStates[idx] ? 0.7 : 0.3;
        ctx.fillRect(wx, wy, windowWidth, windowHeight);
      }
    }
    ctx.globalAlpha = 1;

    // Draw anchor points on building
    for (const anchor of this.anchors) {
      const ax = anchor.x - cameraX;
      const ay = anchor.y - cameraY;

      // Anchor glow
      ctx.fillStyle = 'rgba(255, 170, 0, 0.15)';
      ctx.beginPath();
      ctx.arc(ax, ay, 12, 0, Math.PI * 2);
      ctx.fill();

      // Anchor dot
      ctx.fillStyle = COLORS.ANCHOR_POINT;
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(ax, ay, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

/**
 * Skyscraper - solid obstacle that blocks the player's path.
 * Must fling yourself over it. Has collision.
 */
class Skyscraper {
  constructor(x, width, height, canvasHeight) {
    this.x = x;
    this.width = width;
    this.height = height;
    this.y = canvasHeight - WORLD.GROUND_HEIGHT - height; // top of skyscraper
    this.canvasHeight = canvasHeight;
    // Window grid
    this.windowCols = Math.floor(width / 22);
    this.windowRows = Math.floor(height / 28);
    this.windowStates = [];
    for (let i = 0; i < this.windowCols * this.windowRows; i++) {
      this.windowStates.push(Math.random() < 0.6);
    }
  }

  draw(ctx, cameraX, cameraY) {
    const screenX = this.x - cameraX;
    const screenY = this.y - cameraY;

    if (screenX + this.width < -50 || screenX > CANVAS.BASE_WIDTH + 50) return;

    // Building body - darker, more solid than background buildings
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(screenX, screenY, this.width, this.height);

    // Outline glow (danger feel)
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.4 + Math.sin(Date.now() * 0.003) * 0.15;
    ctx.strokeRect(screenX, screenY, this.width, this.height);
    ctx.globalAlpha = 1;

    // Top edge - bright warning line
    ctx.fillStyle = '#ff6644';
    ctx.fillRect(screenX, screenY, this.width, 3);

    // Windows
    const winW = 10;
    const winH = 12;
    const padX = (this.width - this.windowCols * 20) / 2 + 5;
    const padY = 12;
    for (let row = 0; row < this.windowRows; row++) {
      for (let col = 0; col < this.windowCols; col++) {
        const idx = row * this.windowCols + col;
        const wx = screenX + padX + col * 20;
        const wy = screenY + padY + row * 26;
        ctx.fillStyle = this.windowStates[idx] ? '#ffcc44' : '#0a0a18';
        ctx.globalAlpha = this.windowStates[idx] ? 0.5 : 0.3;
        ctx.fillRect(wx, wy, winW, winH);
      }
    }
    ctx.globalAlpha = 1;
  }

  /**
   * Check if player collides with this skyscraper.
   */
  checkCollision(playerX, playerY, playerWidth, playerHeight) {
    const halfW = playerWidth / 2;
    const halfH = playerHeight / 2;
    return (
      playerX + halfW > this.x &&
      playerX - halfW < this.x + this.width &&
      playerY + halfH > this.y &&
      playerY - halfH < this.y + this.height
    );
  }
}

class Platform {
  constructor(x, y, width, isBuilding = false, variant = 'green') {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = WORLD.PLATFORM_HEIGHT;
    this.isBuilding = isBuilding; // black building platform = 20% jump boost
    this.variant = variant;
  }

  draw(ctx, cameraX, cameraY) {
    const screenX = this.x - cameraX;
    const screenY = this.y - cameraY;

    // Skip if off screen
    if (screenX + this.width < -10 || screenX > CANVAS.BASE_WIDTH + 10) return;

    if (this.isBuilding) {
      // Building platform - black with subtle dark glow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fillRect(screenX - 2, screenY - 2, this.width + 4, this.height + 4);
      ctx.fillStyle = '#111111';
      ctx.fillRect(screenX, screenY, this.width, this.height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(screenX, screenY, this.width, 2);
    } else if (this.variant === 'red') {
      // High grapple platform - rarer, shorter, and placed higher in the sky
      ctx.fillStyle = COLORS.RED_PLATFORM_GLOW;
      ctx.fillRect(screenX - 3, screenY - 3, this.width + 6, this.height + 6);
      ctx.fillStyle = COLORS.RED_PLATFORM;
      ctx.fillRect(screenX, screenY, this.width, this.height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.fillRect(screenX, screenY, this.width, 2);
    } else if (this.variant === 'cloud') {
      // Cloud platform - landable only, not a grapple target
      ctx.fillStyle = COLORS.CLOUD_PLATFORM_GLOW;
      ctx.fillRect(screenX - 4, screenY - 5, this.width + 8, this.height + 10);
      ctx.fillStyle = COLORS.CLOUD_PLATFORM;
      ctx.beginPath();
      ctx.ellipse(screenX + this.width * 0.20, screenY + 3, this.width * 0.22, 9, 0, 0, Math.PI * 2);
      ctx.ellipse(screenX + this.width * 0.45, screenY, this.width * 0.28, 12, 0, 0, Math.PI * 2);
      ctx.ellipse(screenX + this.width * 0.72, screenY + 4, this.width * 0.24, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(screenX, screenY, this.width, this.height);
      ctx.fillStyle = 'rgba(120, 210, 255, 0.45)';
      ctx.fillRect(screenX + 4, screenY + this.height - 2, this.width - 8, 2);
    } else {
      // Normal platform - cyan glow
      ctx.fillStyle = COLORS.PLATFORM_GLOW;
      ctx.fillRect(screenX - 3, screenY - 3, this.width + 6, this.height + 6);
      ctx.fillStyle = COLORS.PLATFORM;
      ctx.fillRect(screenX, screenY, this.width, this.height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.fillRect(screenX, screenY, this.width, 2);
    }
  }

  /**
   * Check if a point is on this platform (for landing detection).
   */
  containsPoint(x, y, playerWidth, playerVY) {
    // Only land if moving downward
    if (playerVY < 0) return false;

    return (
      x + playerWidth / 2 > this.x &&
      x - playerWidth / 2 < this.x + this.width &&
      y >= this.y - 5 &&
      y <= this.y + this.height + 5
    );
  }
}

class World {
  constructor(canvasHeight, seed = 12345) {
    this.rng = new SeededRandom(seed);
    this.seed = seed;
    this.canvasHeight = canvasHeight;

    this.buildings = [];
    this.platforms = [];
    this.anchors = [];    // all anchor points (flat list for quick lookup)
    this.skyscrapers = []; // solid obstacles to fling over
    this._nextSkyscraperX = 8000; // first skyscraper at 8000m

    // Track how far we've generated
    this.generatedUpToX = 0;

    const groundY = canvasHeight - WORLD.GROUND_HEIGHT;

    // Starting building with black rooftop platform
    const startBuildW = 140;
    const startBuildH = 180;
    const startBuildX = 90;
    const startPlatY = groundY - startBuildH;
    // Just the black rooftop platform, no building underneath
    const startRoofX = startBuildX + 5;
    const startRoofW = startBuildW - 10;
    this.platforms.push(new Platform(startRoofX, startPlatY, startRoofW, true));

    // Starter platforms - all high up
    const highY = Math.floor(this.canvasHeight * 0.25);
    const starterPlats = [
      { x: 380, y: highY - 10, w: 50 },
      { x: 680, y: highY - 40, w: 45 },
      { x: 950, y: highY + 10, w: 50 },
    ];
    for (const sp of starterPlats) {
      this.platforms.push(new Platform(sp.x, sp.y, sp.w));
      this.anchors.push({ x: sp.x + sp.w / 2, y: sp.y, platformRef: true });
    }

    // Generate initial world
    this._generateChunk(0, WORLD.BUILDING_GENERATION_AHEAD);
  }

  /**
   * Update world generation and cleanup based on camera position.
   */
  update(cameraX) {
    const generateAhead = cameraX + WORLD.BUILDING_GENERATION_AHEAD;

    // Generate new chunks if camera is approaching the edge
    if (generateAhead > this.generatedUpToX) {
      this._generateChunk(this.generatedUpToX, generateAhead);
    }

    // Cleanup: remove elements far behind camera
    const cleanupX = cameraX - 500;
    this.buildings = this.buildings.filter(b => b.x + b.width > cleanupX);
    this.platforms = this.platforms.filter(p => p.x + p.width > cleanupX);
    this.anchors = this.anchors.filter(a => a.x > cleanupX);
  }

  /**
   * Generate platforms (which double as grapple targets) and
   * background buildings. Anchors are ONLY on/above platforms.
   */
  _generateChunk(startX, endX) {
    let x = Math.max(startX, 400); // leave space for starting area

    while (x < endX) {
      // Platform width shrinks with distance - wide early, tiny later
      const distanceProgress = Math.min(1, x / 15000); // fully narrow by 15000px
      // Red grapple platforms appear half as often as green, are short, and sit higher.
      const isRedPlatform = this.rng.next() < (1 / 3);
      // 3 platform sizes: short, medium, long (random)
      const platSizes = [WORLD.PLATFORM_WIDTH_SHORT, WORLD.PLATFORM_WIDTH_MED, WORLD.PLATFORM_WIDTH_LONG];
      const platWidth = isRedPlatform
        ? WORLD.PLATFORM_WIDTH_SHORT
        : platSizes[Math.floor(this.rng.next() * 3)];
      // Platforms generate HIGH only - minimum height matches top ~30% of screen
      const groundY = this.canvasHeight - WORLD.GROUND_HEIGHT;
      const maxPlatY = Math.floor(this.canvasHeight * 0.65); // can spawn down to 65% of screen
      const minPlatY = 10;                                     // can spawn near top of screen
      // 15% moon-high (Y 40-80), 35% upper quarter, 50% anywhere in range
      const highCutoff = Math.floor(this.canvasHeight * 0.18);
      const roll = this.rng.next();
      let platY;
      if (roll < 0.15) {
        // Moon-height platforms — as high as the moon on screen (~Y 40-80)
        platY = this.rng.nextInt(40, 80);
      } else if (roll < 0.50) {
        platY = this.rng.nextInt(minPlatY, highCutoff);
      } else {
        platY = this.rng.nextInt(minPlatY, maxPlatY);
      }
      if (isRedPlatform) {
        platY = Math.floor(minPlatY + (platY - minPlatY) / 2);
      }

      // Only place green platform if X range doesn't overlap any existing platform or building
      const platOverlaps = this.platforms.some(p => {
        return x < p.x + p.width + 30 && x + platWidth > p.x - 30;
      }) || this.buildings.some(b => {
        return x < b.x + b.width + 30 && x + platWidth > b.x - 30;
      });
      if (!platOverlaps) {
        this.platforms.push(new Platform(x, platY, platWidth, false, isRedPlatform ? 'red' : 'green'));
        this.anchors.push({
          x: x + platWidth / 2,
          y: platY,
          platformRef: true,
        });

        if (isRedPlatform && this.rng.next() < 0.5) {
          const cloudWidth = this.rng.nextInt(80, 150);
          const cloudX = x + platWidth / 2 - cloudWidth / 2 + this.rng.nextInt(-20, 20);
          const cloudY = Math.max(18, platY - this.rng.nextInt(115, 190));
          const cloudOverlaps = this.platforms.some(p => {
            return cloudX < p.x + p.width + 20 &&
              cloudX + cloudWidth > p.x - 20 &&
              Math.abs(cloudY - p.y) < 22;
          });
          if (!cloudOverlaps) {
            this.platforms.push(new Platform(cloudX, cloudY, cloudWidth, false, 'cloud'));
          }
        }
      }

      // Random gap - tighter early, more scattered later
      const earlyBonus = x < 2000 ? 0.5 : (x < 4000 ? 0.75 : 1.0);
      const baseGap = Math.floor(this.rng.nextInt(WORLD.PLATFORM_SPACING_MIN, WORLD.PLATFORM_SPACING_MAX) * earlyBonus);
      const verticalScatter = this.rng.nextInt(-80, 80);
      const gapSize = baseGap + verticalScatter;

      // Background building - always landable with black rooftop platform (after 1000m)
      // More likely in wide gaps between platforms
      const buildingChance = gapSize > 200 ? 0.7 : 0.55;
      if (x > 3000 && this.rng.next() < buildingChance) {
        const bWidth = this.rng.nextInt(WORLD.BUILDING_MIN_WIDTH, WORLD.BUILDING_MAX_WIDTH);
        const bHeight = this.rng.nextInt(WORLD.BUILDING_MIN_HEIGHT, WORLD.BUILDING_MAX_HEIGHT);
        const bX = x + this.rng.nextInt(-100, 200);
        this.buildings.push(new Building(bX, bWidth, bHeight, this.canvasHeight));

        // Always add rooftop platform - remove any green platform that overlaps its X range
        const roofY = this.canvasHeight - bHeight;
        const roofX = bX + 5;
        const roofW = bWidth - 10;
        // Remove green platforms that sit directly above this building
        this.platforms = this.platforms.filter(p => {
          if (p.isBuilding) return true; // keep other building platforms
          const xOverlap = p.x < roofX + roofW + 30 && p.x + p.width > roofX - 30;
          return !xOverlap; // remove if X overlaps
        });
        this.platforms.push(new Platform(roofX, roofY, roofW, true));
      }

      x += platWidth + gapSize;

      // Skyscraper every 5000m (50000px)
      if (!this._nextSkyscraperX) this._nextSkyscraperX = 8000;
      if (x >= this._nextSkyscraperX) {
        this._nextSkyscraperX = x + 5000;
        const skyW = this.rng.nextInt(60, 100);
        // Height ranges from 90% to 128% of screen (-25% from previous)
        const skyH = this.rng.nextInt(
          Math.floor(this.canvasHeight * 0.9),
          Math.floor(this.canvasHeight * 1.28)
        );
        const skyX = x - baseGap / 2 - skyW / 2; // place in the gap
        this.skyscrapers.push(new Skyscraper(skyX, skyW, skyH, this.canvasHeight));

        // Add a platform on top of the skyscraper so you can land there
        const topY = this.canvasHeight - WORLD.GROUND_HEIGHT - skyH;
        const topPlatW = this.rng.nextInt(35, skyW - 10);
        const topPlatX = skyX + (skyW - topPlatW) / 2;
        this.platforms.push(new Platform(topPlatX, topY, topPlatW, true)); // black building platform
        this.anchors.push({ x: topPlatX + topPlatW / 2, y: topY, platformRef: true });

        // Always place a grapple platform before the skyscraper for swinging over it
        const helpPlatY = this.rng.nextInt(
          Math.floor(this.canvasHeight * 0.15),
          Math.floor(this.canvasHeight * 0.35)
        );
        const helpPlatW = this.rng.nextInt(40, 70);
        const helpPlatX = skyX - helpPlatW - this.rng.nextInt(60, 120);
        this.platforms.push(new Platform(helpPlatX, helpPlatY, helpPlatW));
        this.anchors.push({ x: helpPlatX + helpPlatW / 2, y: helpPlatY, platformRef: true });
      }
    }

    this.generatedUpToX = x;
  }

  /**
   * Find the nearest anchor point to a given position and direction.
   * @param {number} fromX - starting x
   * @param {number} fromY - starting y
   * @param {number} dirX - aim direction x
   * @param {number} dirY - aim direction y
   * @param {number} maxRange - maximum hook range
   * @returns {{ x: number, y: number } | null}
   */
  findNearestAnchor(fromX, fromY, dirX, dirY, maxRange = 575, obstacles = null) {
    let bestAnchor = null;
    let bestScore = Infinity;

    // Check every platform - rope can attach to ANY point along the top edge
    for (const platform of this.platforms) {
      // Skip building/cloud platforms - can't hook onto them, only land on them
      if (platform.isBuilding || platform.variant === 'cloud') continue;
      const isBuildingPlatform = false;

      // Find the closest point on the platform's top edge to the aim ray
      // Cast a ray from (fromX, fromY) in direction (dirX, dirY)
      // Find where it intersects or comes closest to the platform top

      // Clamp to platform bounds - the attach point is wherever
      // the aim line is closest to on the platform surface
      const platLeft = platform.x;
      const platRight = platform.x + platform.width;
      const platY = platform.y;

      // Project along aim ray to find nearest point to platform
      // Use parametric ray: P = from + t * dir
      // Find t where ray is closest to platform top edge
      let attachX, attachY;

      if (dirY !== 0) {
        // t where ray reaches platform's Y level
        const t = (platY - fromY) / dirY;
        if (t > 0) {
          const rayX = fromX + dirX * t;
          // Clamp to platform bounds
          attachX = Math.max(platLeft, Math.min(platRight, rayX));
          attachY = platY;
        } else {
          continue; // platform is behind the aim direction
        }
      } else {
        // Horizontal aim - find closest point on platform
        attachX = Math.max(platLeft, Math.min(platRight, fromX));
        attachY = platY;
      }

      const dx = attachX - fromX;
      const dy = attachY - fromY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > maxRange) continue;
      if (dist < 30) continue;

      // Check aim alignment
      const ndx = dx / dist;
      const ndy = dy / dist;
      const dot = ndx * dirX + ndy * dirY;

      if (dot < 0.6) continue;  // stricter aim - must be pointed more accurately at platform

      // Score by distance weighted by alignment
      const score = dist / (dot * dot);
      if (score < bestScore) {
        bestScore = score;
        bestAnchor = { x: attachX, y: attachY, platformRef: true, isBuilding: !!isBuildingPlatform };
      }
    }

    // Also check live birds and drones as hookable targets (not missiles, not red birds)
    if (obstacles) {
      for (const obs of obstacles) {
        if (!obs.alive) continue;
        if (obs.type !== ObstacleType.BIRD && obs.type !== ObstacleType.DRONE) continue;
        if (obs.isRedBird) continue; // red birds cut rope, can't hook them

        const dx = obs.x - fromX;
        const dy = obs.y - fromY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > maxRange || dist < 30) continue;

        const ndx = dx / dist;
        const ndy = dy / dist;
        const dot = ndx * dirX + ndy * dirY;
        if (dot < 0.6) continue;

        const score = dist / (dot * dot);
        if (score < bestScore) {
          bestScore = score;
          bestAnchor = { x: obs.x, y: obs.y, birdRef: obs };
        }
      }
    }

    return bestAnchor;
  }

  /**
   * Check if player has landed on any platform.
   * Returns the platform or null.
   */
  checkPlatformLanding(playerX, playerY, playerWidth, playerVY) {
    for (const platform of this.platforms) {
      if (platform.containsPoint(playerX, playerY, playerWidth, playerVY)) {
        return platform;
      }
    }
    return null;
  }

  /**
   * Get the ground Y position (top of ground).
   */
  getGroundY() {
    return this.canvasHeight - WORLD.GROUND_HEIGHT;
  }

  /**
   * Check if player hit the ground (SPLAT).
   */
  checkGroundCollision(playerY, playerHeight) {
    return (playerY + playerHeight / 2) >= this.getGroundY();
  }

  /**
   * Draw all world elements.
   */
  draw(ctx, cameraX, cameraY) {
    // Draw buildings (background, behind everything)
    for (const building of this.buildings) {
      building.draw(ctx, cameraX, cameraY);
    }

    // Draw skyscrapers (solid obstacles, in front of background buildings)
    for (const sky of this.skyscrapers) {
      sky.draw(ctx, cameraX, cameraY);
    }

    // Draw ground
    this._drawGround(ctx, cameraX, cameraY);

    // Draw platforms
    for (const platform of this.platforms) {
      platform.draw(ctx, cameraX, cameraY);
    }
  }

  /**
   * Check if player hits a skyscraper (death).
   */
  checkSkyscraperCollision(playerX, playerY, playerWidth, playerHeight) {
    for (const sky of this.skyscrapers) {
      if (sky.checkCollision(playerX, playerY, playerWidth, playerHeight)) {
        return sky;
      }
    }
    return null;
  }

  /**
   * Check if player hits the side of a building (death).
   * Landing on top is OK (handled by rooftop platform), but slamming into the side kills.
   */
  checkBuildingCollision(playerX, playerY, playerWidth, playerHeight) {
    const halfW = playerWidth / 2;
    const halfH = playerHeight / 2;
    for (const b of this.buildings) {
      // Player AABB
      const pLeft = playerX - halfW;
      const pRight = playerX + halfW;
      const pTop = playerY - halfH;
      const pBottom = playerY + halfH;

      // Building AABB
      const bLeft = b.x;
      const bRight = b.x + b.width;
      const bTop = b.y;
      const bBottom = b.canvasHeight;

      // Check overlap
      if (pRight > bLeft && pLeft < bRight && pBottom > bTop + 8 && pTop < bBottom) {
        // Player is inside the building body (not just touching the rooftop)
        return b;
      }
    }
    return null;
  }

  _drawGround(ctx, cameraX, cameraY) {
    const groundY = this.getGroundY() - cameraY;
    const groundH = WORLD.GROUND_HEIGHT + 200; // extend past bottom of screen

    // Ground body
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, groundY, CANVAS.BASE_WIDTH, groundH);

    // Ground top edge (lighter line)
    ctx.fillStyle = '#333333';
    ctx.fillRect(0, groundY, CANVAS.BASE_WIDTH, 3);

    // Ground texture lines
    ctx.fillStyle = '#222222';
    for (let i = 0; i < CANVAS.BASE_WIDTH; i += 40) {
      const gx = ((i - cameraX * 0.5) % CANVAS.BASE_WIDTH + CANVAS.BASE_WIDTH) % CANVAS.BASE_WIDTH;
      ctx.fillRect(gx, groundY + 8, 20, 2);
      ctx.fillRect(gx + 10, groundY + 20, 15, 2);
    }

    // Danger stripe at top of ground
    ctx.fillStyle = '#ff4444';
    ctx.globalAlpha = 0.3;
    for (let i = -20; i < CANVAS.BASE_WIDTH + 20; i += 30) {
      const sx = ((i - cameraX * 0.8) % (CANVAS.BASE_WIDTH + 40) + CANVAS.BASE_WIDTH + 40) % (CANVAS.BASE_WIDTH + 40) - 20;
      ctx.beginPath();
      ctx.moveTo(sx, groundY);
      ctx.lineTo(sx + 15, groundY);
      ctx.lineTo(sx + 5, groundY + 8);
      ctx.lineTo(sx - 10, groundY + 8);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}


// ===== camera.js =====
// ============================================================
// Swing Blade - Camera System
// ============================================================
// Smooth-following camera that tracks the player.
// Handles parallax background rendering.
// ============================================================


class Camera {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.targetX = 0;
    this.targetY = 0;
    this.zoom = 1;

    // Parallax layers (drawn from back to front)
    this.stars = [];
    for (let i = 0; i < 60; i++) {
      this.stars.push({
        x: Math.random() * CANVAS.BASE_WIDTH * 3,
        y: Math.random() * CANVAS.BASE_HEIGHT * 0.6,
        size: Math.random() * 2 + 0.5,
        brightness: Math.random() * 0.5 + 0.3,
      });
    }

    // Far buildings (silhouettes)
    this.farBuildings = [];
    for (let i = 0; i < 30; i++) {
      this.farBuildings.push({
        x: i * 120 - 200,
        width: 60 + Math.random() * 100,
        height: 80 + Math.random() * 200,
      });
    }

    // Mid buildings
    this.midBuildings = [];
    for (let i = 0; i < 25; i++) {
      this.midBuildings.push({
        x: i * 150 - 300,
        width: 50 + Math.random() * 80,
        height: 120 + Math.random() * 250,
      });
    }
  }

  /**
   * Update camera to follow a target position.
   */
  update(targetX, targetY, canvasHeight) {
    this.targetX = targetX - CAMERA.OFFSET_X;

    // The higher the player is, the more the camera shifts DOWN
    // so you can see what's below you
    const groundY = canvasHeight || CANVAS.BASE_HEIGHT;
    const height = groundY - targetY;
    const heightRatio = Math.max(0, Math.min(1, height / groundY));

    // At ground level: normal offset. High up: camera shifts much lower (positive offset)
    // This puts the player in the upper portion of the screen when high
    const dynamicOffset = CAMERA.VERTICAL_OFFSET + heightRatio * 250;

    this.targetY = targetY + dynamicOffset - CANVAS.BASE_HEIGHT / 2;

    // Smooth follow (lerp)
    this.x += (this.targetX - this.x) * CAMERA.SMOOTHING;
    this.y += (this.targetY - this.y) * CAMERA.VERTICAL_SMOOTHING;

    // Clamp camera so the ground is always visible at the bottom of the screen
    // Ground is at y~0 in world coords. Camera.y is the top of the viewport in world space.
    // We want the bottom of the viewport (camera.y + BASE_HEIGHT) to always be >= ground level
    const groundWorldY = CANVAS.BASE_HEIGHT * 0.7; // approximate ground position
    const maxCameraY = groundWorldY - CANVAS.BASE_HEIGHT;
    if (this.y > maxCameraY) {
      this.y = maxCameraY;
    }
  }

  /**
   * Draw the parallax background.
   */
  drawBackground(ctx) {
    // Sky gradient
    const gradient = ctx.createLinearGradient(0, 0, 0, CANVAS.BASE_HEIGHT);
    gradient.addColorStop(0, COLORS.SKY_TOP);
    gradient.addColorStop(1, COLORS.SKY_BOTTOM);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, CANVAS.BASE_WIDTH, CANVAS.BASE_HEIGHT);

    // Stars
    for (const star of this.stars) {
      const sx = ((star.x - this.x * 0.02) % (CANVAS.BASE_WIDTH * 3) + CANVAS.BASE_WIDTH * 3) % (CANVAS.BASE_WIDTH * 3) - CANVAS.BASE_WIDTH;
      const sy = star.y - this.y * 0.01;

      if (sx < -10 || sx > CANVAS.BASE_WIDTH + 10) continue;

      ctx.globalAlpha = star.brightness;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(sx, sy, star.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Moon
    const moonX = CANVAS.BASE_WIDTH * 0.8 - this.x * 0.01;
    const moonY = 60 - this.y * 0.005;
    ctx.fillStyle = '#ddddcc';
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(moonX, moonY, 25, 0, Math.PI * 2);
    ctx.fill();
    // Moon shadow (crescent effect)
    ctx.fillStyle = COLORS.SKY_TOP;
    ctx.beginPath();
    ctx.arc(moonX + 8, moonY - 3, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Far buildings (slowest parallax)
    this._drawBuildingLayer(ctx, this.farBuildings, 0.1, 0.05, '#0d0d20', 0.5);

    // Mid buildings (medium parallax)
    this._drawBuildingLayer(ctx, this.midBuildings, 0.3, 0.1, '#141430', 0.7);
  }

  _drawBuildingLayer(ctx, buildings, parallaxX, parallaxY, color, alpha) {
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;

    for (const b of buildings) {
      // Parallax offset: closer layers move faster
      const sx = ((b.x - this.x * parallaxX) % 4000 + 4000) % 4000 - 500;
      const sy = CANVAS.BASE_HEIGHT - b.height - this.y * parallaxY;

      if (sx + b.width < -10 || sx > CANVAS.BASE_WIDTH + 10) continue;

      ctx.fillRect(sx, sy, b.width, b.height + 100); // extend past bottom
    }

    ctx.globalAlpha = 1;
  }
}


// ===== obstacles.js =====
// ============================================================
// Swing Blade - Obstacles & Projectiles
// ============================================================
// Birds, drones, missiles - things to slice with your blade.
// Hitting one gives you a jump boost.
// ============================================================


const ObstacleType = {
  BIRD: 'bird',
  DRONE: 'drone',
  MISSILE: 'missile',
};

class Obstacle {
  constructor(type, x, y) {
    this.type = type;
    this.x = x;
    this.y = y;
    this.alive = true;
    this.deathTimer = 0;        // for death animation
    this.size = 20;
  }

  update(dt, playerX, playerY) {
    // Override in subclasses
  }

  draw(ctx, cameraX, cameraY) {
    // Override in subclasses
  }

  /**
   * Check if a circle (blade hitbox) intersects this obstacle.
   */
  checkHit(hitbox) {
    if (!this.alive || !hitbox) return false;
    const dx = this.x - hitbox.x;
    const dy = this.y - hitbox.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    return dist < (this.size + hitbox.radius);
  }

  /**
   * Kill this obstacle (hit by blade).
   */
  kill() {
    this.alive = false;
    this.deathTimer = 300; // ms for death particles
  }

  /**
   * Check if this obstacle should be removed from the world.
   */
  shouldRemove(cameraX) {
    if (!this.alive && this.deathTimer <= 0) return true;
    if (this.x < cameraX - 200) return true;  // far behind camera
    if (this.x > cameraX + CANVAS.BASE_WIDTH + 500) return true; // too far ahead
    return false;
  }

  /**
   * Draw death particles.
   */
  drawDeathEffect(ctx, cameraX, cameraY, dt) {
    if (this.alive || this.deathTimer <= 0) return;

    this.deathTimer -= dt;
    const progress = 1 - (this.deathTimer / 300);
    const screenX = this.x - cameraX;
    const screenY = this.y - cameraY;

    // Expanding particles
    const numParticles = 6;
    for (let i = 0; i < numParticles; i++) {
      const angle = (Math.PI * 2 / numParticles) * i;
      const dist = progress * 30;
      const px = screenX + Math.cos(angle) * dist;
      const py = screenY + Math.sin(angle) * dist;
      const size = (1 - progress) * 4;

      ctx.globalAlpha = 1 - progress;
      ctx.fillStyle = '#ffaa44';
      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

class Bird extends Obstacle {
  constructor(x, y, direction = -1, rng = null) {
    super(ObstacleType.BIRD, x, y);
    this.size = OBSTACLES.BIRD_SIZE;
    this.direction = direction;  // -1 = left, 1 = right
    const rand = rng && typeof rng.next === 'function' ? () => rng.next() : () => Math.random();
    const speeds = [OBSTACLES.BIRD_SPEED_SLOW, OBSTACLES.BIRD_SPEED_MED, OBSTACLES.BIRD_SPEED_FAST];
    this.speed = speeds[Math.floor(rand() * 3)];
    this.wingPhase = rand() * Math.PI * 2;
    this.isRedBird = false; // set by ObstacleManager based on distance
  }

  update(dt) {
    if (!this.alive) return;
    this.wingPhase += 0.1; // always flap, even when frozen
    if (this.frozen) return; // hooked - stay stationary (but wings keep going)

    const dtF = dt / 16.667;
    this.x += this.speed * this.direction * dtF;
  }

  draw(ctx, cameraX, cameraY) {
    this.drawDeathEffect(ctx, cameraX, cameraY, 16);
    if (!this.alive) return;

    const screenX = this.x - cameraX;
    const screenY = this.y - cameraY;

    // Bird body
    ctx.fillStyle = this.isRedBird ? '#ff3333' : COLORS.OBSTACLE_BIRD;
    ctx.beginPath();
    ctx.ellipse(screenX, screenY, this.size * 0.6, this.size * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wings (flapping)
    const wingY = Math.sin(this.wingPhase) * 8;
    ctx.strokeStyle = this.isRedBird ? '#ff3333' : COLORS.OBSTACLE_BIRD;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    // Left wing
    ctx.moveTo(screenX - 3, screenY);
    ctx.quadraticCurveTo(screenX - this.size, screenY - wingY - 5, screenX - this.size * 0.8, screenY - wingY);
    // Right wing
    ctx.moveTo(screenX + 3, screenY);
    ctx.quadraticCurveTo(screenX + this.size, screenY - wingY - 5, screenX + this.size * 0.8, screenY - wingY);
    ctx.stroke();
  }
}

class Drone extends Obstacle {
  // moveType: 0=horizontal, 1=vertical, 2=diagonal-right, 3=diagonal-left
  constructor(x, y, moveType = 0, rng = null) {
    super(ObstacleType.DRONE, x, y);
    this.size = OBSTACLES.DRONE_SIZE;
    this.originX = x;
    this.originY = y;
    this.moveType = moveType;
    const rand = rng && typeof rng.next === 'function' ? () => rng.next() : () => Math.random();
    this.moveRange = rand() < 0.5 ? 80 : 160; // small or large patrol distance
    this.moveSpeed = this.moveRange > 100 ? 1.0 : 1.5; // fast patrol slowed down
    this.movePhase = rand() * Math.PI * 2; // randomize start position
  }

  update(dt) {
    if (!this.alive) return;
    if (this.frozen) return; // hooked - stay in place
    const dtF = dt / 16.667;
    this.movePhase += this.moveSpeed * 0.03 * dtF;
    const offset = Math.sin(this.movePhase) * this.moveRange;
    switch (this.moveType) {
      case 0: // horizontal
        this.x = this.originX + offset;
        break;
      case 1: // vertical
        this.y = this.originY + offset;
        break;
      case 2: // diagonal right (\)
        this.x = this.originX + offset;
        this.y = this.originY + offset;
        break;
      case 3: // diagonal left (/)
        this.x = this.originX + offset;
        this.y = this.originY - offset;
        break;
    }
  }

  draw(ctx, cameraX, cameraY) {
    this.drawDeathEffect(ctx, cameraX, cameraY, 16);
    if (!this.alive) return;

    const screenX = this.x - cameraX;
    const screenY = this.y - cameraY;

    // Drone body
    ctx.fillStyle = COLORS.OBSTACLE_DRONE;
    ctx.fillRect(
      screenX - this.size * 0.5,
      screenY - this.size * 0.3,
      this.size,
      this.size * 0.6
    );

    // Propellers
    ctx.strokeStyle = '#aaaaff';
    ctx.lineWidth = 1.5;
    const propAngle = Date.now() * 0.02;
    // Left prop
    ctx.beginPath();
    ctx.moveTo(screenX - this.size * 0.4 + Math.cos(propAngle) * 8, screenY - this.size * 0.3);
    ctx.lineTo(screenX - this.size * 0.4 - Math.cos(propAngle) * 8, screenY - this.size * 0.3);
    ctx.stroke();
    // Right prop
    ctx.beginPath();
    ctx.moveTo(screenX + this.size * 0.4 + Math.cos(propAngle + 1) * 8, screenY - this.size * 0.3);
    ctx.lineTo(screenX + this.size * 0.4 - Math.cos(propAngle + 1) * 8, screenY - this.size * 0.3);
    ctx.stroke();

    // Eye/lens
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(screenX, screenY, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Missile extends Obstacle {
  constructor(x, y, targetX, targetY) {
    super(ObstacleType.MISSILE, x, y);
    this.size = OBSTACLES.MISSILE_SIZE;
    this.speed = Math.random() < 0.5 ? 1.4 : 2.4; // slow or fast

    // Initial direction toward target
    const dx = targetX - x;
    const dy = targetY - y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    this.vx = (dx / dist) * this.speed;
    this.vy = (dy / dist) * this.speed;
    this.angle = Math.atan2(dy, dx);

    this.trailPositions = [];
  }

  update(dt, playerX, playerY) {
    if (!this.alive) return;

    // Slowly track toward player
    const dx = playerX - this.x;
    const dy = playerY - this.y;
    const targetAngle = Math.atan2(dy, dx);

    // Rotate toward target
    let angleDiff = targetAngle - this.angle;
    // Normalize angle difference to [-PI, PI]
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

    const dtF = dt / 16.667;
    this.angle += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), OBSTACLES.MISSILE_TURN_RATE * dtF);

    this.vx = Math.cos(this.angle) * this.speed;
    this.vy = Math.sin(this.angle) * this.speed;

    this.x += this.vx * dtF;
    this.y += this.vy * dtF;

    // Trail
    this.trailPositions.unshift({ x: this.x, y: this.y });
    if (this.trailPositions.length > 10) this.trailPositions.pop();
  }

  draw(ctx, cameraX, cameraY) {
    this.drawDeathEffect(ctx, cameraX, cameraY, 16);
    if (!this.alive) return;

    const screenX = this.x - cameraX;
    const screenY = this.y - cameraY;

    // Trail
    for (let i = 1; i < this.trailPositions.length; i++) {
      const pos = this.trailPositions[i];
      const tx = pos.x - cameraX;
      const ty = pos.y - cameraY;
      ctx.globalAlpha = (1 - i / this.trailPositions.length) * 0.4;
      ctx.fillStyle = '#ff6644';
      ctx.beginPath();
      ctx.arc(tx, ty, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Missile body
    ctx.save();
    ctx.translate(screenX, screenY);
    ctx.rotate(this.angle);

    ctx.fillStyle = COLORS.OBSTACLE_MISSILE;
    // Body
    ctx.beginPath();
    ctx.moveTo(this.size * 0.7, 0);
    ctx.lineTo(-this.size * 0.5, -this.size * 0.3);
    ctx.lineTo(-this.size * 0.5, this.size * 0.3);
    ctx.closePath();
    ctx.fill();

    // Exhaust
    ctx.fillStyle = '#ffaa44';
    ctx.beginPath();
    ctx.moveTo(-this.size * 0.5, -this.size * 0.15);
    ctx.lineTo(-this.size * 0.8, 0);
    ctx.lineTo(-this.size * 0.5, this.size * 0.15);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
}


// ============================================================
// Enemy Ninja AI — full AI opponents that can jump, hook, swing, and blade
// ============================================================

const ENEMY_NINJA = {
  WIDTH: 24,
  HEIGHT: 32,
  DETECT_RANGE: 400,       // px — start pursuing when player is this close
  ATTACK_RANGE: 55,        // px — blade attack range
  BLADE_RADIUS: 40,        // slightly smaller than player blade
  BLADE_COOLDOWN_MS: 1200, // time between attacks
  BLADE_ANIM_MS: 700,             // longer so player can see it
  JUMP_FORCE: -7.0,         // bigger jumps since no hook
  WALK_SPEED: 2.2,         // slightly slower than player
  AIR_DRIFT: 0.30,
  MAX_AIR_SPEED: 4.5,
  HOOK_RANGE: 250,         // how far they can shoot a hook
  HOOK_SPEED: 16,          // hook travel speed
  SWING_FORCE: 0.06,
  SWING_DAMPING: 0.992,
  MAX_ANGULAR_VEL: 0.08,
  HOOK_DURATION_MS: 4000,  // max time on a hook
  SPAWN_START_DISTANCE: 5000, // start appearing at 5000m
  SPAWN_INTERVAL_PX: 2000, // one ninja every ~2000px
  MAX_ACTIVE: 3,           // max ninjas alive at once
  JUMP_COOLDOWN_MS: 400,   // shorter cooldown - they jump more aggressively
  HOOK_COOLDOWN_MS: 2000,  // minimum time between hook attempts
  RELEASE_SPEED: 1.0,      // launch multiplier on hook release
};

const ANGEL_ENEMY = {
  WIDTH: 30,
  HEIGHT: 34,
  FOLLOW_SPEED: 2.7,
  VERTICAL_SPEED: 2.1,
  ATTACK_RANGE: 58,
  BLADE_RADIUS: 63,
  BLADE_COOLDOWN_MS: 1050,
  BLADE_ANIM_MS: 620,
};

const ENinjaState = {
  PATROL: 'patrol',
  PURSUE: 'pursue',
  AIRBORNE: 'airborne',
  SWINGING: 'swinging',
  DEAD: 'dead',
};

class EnemyNinja {
  constructor(x, y, platformRef = null) {
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.state = ENinjaState.PATROL;
    this.facingRight = Math.random() < 0.5;
    this.alive = true;
    this.platform = platformRef; // platform we're standing on

    // Patrol
    this.patrolDir = this.facingRight ? 1 : -1;
    this.patrolTimer = 0;
    this.patrolSwitchMs = 1500 + Math.random() * 2000;

    // Blade
    this.bladeActive = false;
    this.bladeTimer = 0;
    this.bladeCooldown = 0;
    this.bladeLinger = 0;

    // Jump
    this.jumpCooldown = 0;

    // Hook/Swing
    this.hookState = 'idle'; // idle | traveling | attached
    this.hookX = 0;
    this.hookY = 0;
    this.hookTargetX = 0;
    this.hookTargetY = 0;
    this.anchorX = 0;
    this.anchorY = 0;
    this.ropeLength = 0;
    this.ropeAngle = 0;
    this.angularVel = 0;
    this.hookTimer = 0;
    this.hookCooldown = 0;

    // Death effect
    this.deathTimer = 0;
    this.deathX = 0;
    this.deathY = 0;
  }

  update(dt, playerX, playerY, world) {
    if (!this.alive) {
      this.deathTimer -= dt;
      return;
    }

    // Cooldowns
    if (this.bladeCooldown > 0) this.bladeCooldown -= dt;
    if (this.jumpCooldown > 0) this.jumpCooldown -= dt;
    if (this.hookCooldown > 0) this.hookCooldown -= dt;
    if (this.bladeTimer > 0) {
      this.bladeTimer -= dt;
      if (this.bladeTimer <= 0) {
        this.bladeActive = false;
        this.bladeLinger = 250;
      }
    }
    if (this.bladeLinger > 0) this.bladeLinger -= dt;

    const dtF = dt / 16.667;
    const distToPlayer = Math.sqrt((this.x - playerX) ** 2 + (this.y - playerY) ** 2);
    const dxToPlayer = playerX - this.x;
    const dyToPlayer = playerY - this.y;

    switch (this.state) {
      case ENinjaState.PATROL:
        // Walk back and forth on platform
        this.patrolTimer += dt;
        if (this.patrolTimer >= this.patrolSwitchMs) {
          this.patrolTimer = 0;
          this.patrolDir *= -1;
          this.patrolSwitchMs = 1500 + Math.random() * 2000;
        }
        this.vx = this.patrolDir * ENEMY_NINJA.WALK_SPEED * 0.5;
        this.facingRight = this.vx > 0;

        // Stay on platform
        if (this.platform) {
          const pLeft = this.platform.x + 5;
          const pRight = this.platform.x + this.platform.width - 5;
          if (this.x <= pLeft) { this.x = pLeft; this.patrolDir = 1; }
          if (this.x >= pRight) { this.x = pRight; this.patrolDir = -1; }
        }

        this.x += this.vx * dtF;

        // Detect player — blade slash as warning when spotted
        if (distToPlayer < ENEMY_NINJA.DETECT_RANGE && this.bladeCooldown <= 0 && Math.random() < 0.015) {
          this._startBlade();
        }
        if (distToPlayer < ENEMY_NINJA.DETECT_RANGE) {
          this.state = ENinjaState.PURSUE;
        }
        break;

      case ENinjaState.PURSUE: {
        this.facingRight = dxToPlayer > 0;

        // Run toward player
        this.vx = (dxToPlayer > 0 ? 1 : -1) * ENEMY_NINJA.WALK_SPEED;
        this.x += this.vx * dtF;

        // Stay on platform edge — if at edge, jump toward player
        let onPlatform = true;
        if (this.platform) {
          const pLeft = this.platform.x;
          const pRight = this.platform.x + this.platform.width;
          if (this.x < pLeft || this.x > pRight) onPlatform = false;
        }

        // Blade attack if close enough
        if (distToPlayer < ENEMY_NINJA.ATTACK_RANGE && this.bladeCooldown <= 0) {
          this._startBlade();
        }
        // Sporadic blade when player is anywhere nearby — very visible threat
        if (distToPlayer < ENEMY_NINJA.DETECT_RANGE && this.bladeCooldown <= 0 && Math.random() < 0.02) {
          this._startBlade();
        }

        // Jump if player is above or at platform edge
        if ((dyToPlayer < -40 || !onPlatform) && this.jumpCooldown <= 0) {
          this.vy = ENEMY_NINJA.JUMP_FORCE;
          this.state = ENinjaState.AIRBORNE;
          this.jumpCooldown = ENEMY_NINJA.JUMP_COOLDOWN_MS;
        }


        break;
      }

      case ENinjaState.AIRBORNE: {
        // Gravity
        this.vy += PHYSICS.GRAVITY * dtF;
        if (this.vy > PHYSICS.TERMINAL_VELOCITY) this.vy = PHYSICS.TERMINAL_VELOCITY;

        // Air drift toward player
        const airDir = dxToPlayer > 0 ? 1 : -1;
        this.vx += airDir * ENEMY_NINJA.AIR_DRIFT * dtF;
        if (Math.abs(this.vx) > ENEMY_NINJA.MAX_AIR_SPEED) {
          this.vx = airDir * ENEMY_NINJA.MAX_AIR_SPEED;
        }
        this.facingRight = this.vx > 0;

        this.x += this.vx * dtF;
        this.y += this.vy * dtF;

        // Blade attack in air
        if (distToPlayer < ENEMY_NINJA.ATTACK_RANGE && this.bladeCooldown <= 0) {
          this._startBlade();
        }
        // Sporadic blade in air — aggressive
        if (distToPlayer < ENEMY_NINJA.DETECT_RANGE && this.bladeCooldown <= 0 && Math.random() < 0.025) {
          this._startBlade();
        }



        // Land on platforms
        if (this.vy > 0) {
          const landed = world.checkPlatformLanding(
            this.x, this.y + ENEMY_NINJA.HEIGHT / 2, ENEMY_NINJA.WIDTH, this.vy
          );
          if (landed) {
            this.y = landed.y - ENEMY_NINJA.HEIGHT / 2;
            this.vy = 0;
            this.vx = 0;
            this.platform = landed;
            this.state = distToPlayer < ENEMY_NINJA.DETECT_RANGE
              ? ENinjaState.PURSUE : ENinjaState.PATROL;
          }
        }

        // Land on ground
        const groundY = world.getGroundY();
        if (this.y + ENEMY_NINJA.HEIGHT / 2 >= groundY) {
          this.y = groundY - ENEMY_NINJA.HEIGHT / 2;
          this.vy = 0;
          this.vx = 0;
          this.platform = null;
          this.state = ENinjaState.PURSUE;
        }

        break;
      }


    }
  }

  _startBlade() {
    this.bladeActive = true;
    this.bladeTimer = ENEMY_NINJA.BLADE_ANIM_MS;
    this.bladeCooldown = ENEMY_NINJA.BLADE_COOLDOWN_MS;
  }


  getBladeHitbox() {
    if (!this.bladeActive || !this.alive) return null;
    return { x: this.x, y: this.y, radius: ENEMY_NINJA.BLADE_RADIUS };
  }

  getBoundingBox() {
    return {
      x: this.x - ENEMY_NINJA.WIDTH / 2,
      y: this.y - ENEMY_NINJA.HEIGHT / 2,
      width: ENEMY_NINJA.WIDTH,
      height: ENEMY_NINJA.HEIGHT,
    };
  }

  kill() {
    this.alive = false;
    this.deathTimer = 500;
    this.deathX = this.x;
    this.deathY = this.y;
    this.hookState = 'idle';
  }

  get shouldRemove() {
    return !this.alive && this.deathTimer <= 0;
  }

  draw(ctx, cameraX, cameraY, spriteManager) {
    // Death burst
    if (!this.alive) {
      if (this.deathTimer > 0) {
        const progress = 1 - (this.deathTimer / 500);
        const sx = this.deathX - cameraX;
        const sy = this.deathY - cameraY;
        ctx.globalAlpha = 1 - progress;
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI * 2 / 6) * i + progress * 2;
          const dist = progress * 30;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(sx + Math.cos(angle) * dist, sy + Math.sin(angle) * dist, 4 * (1 - progress), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      return;
    }

    const sx = this.x - cameraX;
    const sy = this.y - cameraY;

    ctx.save();

    // Blade slash effect — bright visible animation for enemy
    if (this.bladeActive) {
      ctx.save();
      ctx.translate(sx, sy);
      const slashProgress = 1 - (this.bladeTimer / ENEMY_NINJA.BLADE_ANIM_MS);
      const sweepAngle = Math.PI * 2 * slashProgress;
      const startAngle = -Math.PI / 2;
      const eR = ENEMY_NINJA.BLADE_RADIUS;

      // Outer ring — bright white, thick
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.globalAlpha = (1 - slashProgress * 0.3) * 0.9;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.arc(0, 0, eR, startAngle, startAngle + sweepAngle);
      ctx.stroke();

      // Inner ring — slightly dimmer
      ctx.strokeStyle = '#dddddd';
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = (1 - slashProgress * 0.4) * 0.7;
      ctx.beginPath();
      ctx.arc(0, 0, eR * 0.85, startAngle, startAngle + sweepAngle);
      ctx.stroke();

      // Flash at completion
      if (slashProgress > 0.85) {
        const flashAlpha = (slashProgress - 0.85) * 6;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.globalAlpha = (1 - flashAlpha) * 0.9;
        ctx.shadowBlur = 35;
        ctx.beginPath();
        ctx.arc(0, 0, eR * (1 + flashAlpha * 0.15), 0, Math.PI * 2);
        ctx.stroke();
      }

      // Blade tip — larger, brighter
      const tipAngle = startAngle + sweepAngle;
      const tipX2 = Math.cos(tipAngle) * eR;
      const tipY2 = Math.sin(tipAngle) * eR;
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#ffffff';
      ctx.beginPath();
      ctx.arc(tipX2, tipY2, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Blade linger afterglow (enemy)
    if (!this.bladeActive && this.bladeLinger > 0) {
      const lingerAlpha = this.bladeLinger / 250;
      const eR = ENEMY_NINJA.BLADE_RADIUS;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.globalAlpha = lingerAlpha * 0.6;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 15 * lingerAlpha;
      ctx.beginPath();
      ctx.arc(0, 0, eR * (1 + (1 - lingerAlpha) * 0.1), 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = lingerAlpha * 0.3;
      ctx.beginPath();
      ctx.arc(0, 0, eR * 0.85 * (1 + (1 - lingerAlpha) * 0.1), 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    }


    // Draw ninja sprite (always visible, even during blade)
    ctx.globalAlpha = 1;
    if (spriteManager) {
      const sprite = spriteManager.getEnemyNinja(this.state, false, this.facingRight);
      if (sprite) {
        spriteManager.drawCentered(ctx, sprite, sx, sy);
      }
    } else {
      ctx.fillStyle = '#dddddd';
      ctx.fillRect(sx - ENEMY_NINJA.WIDTH / 2, sy - ENEMY_NINJA.HEIGHT / 2, ENEMY_NINJA.WIDTH, ENEMY_NINJA.HEIGHT);
    }

    ctx.restore();
  }
}

class AngelEnemy {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.active = false;
    this.facingRight = false;
    this.bladeActive = false;
    this.bladeTimer = 0;
    this.bladeCooldown = 0;
    this.bladeLinger = 0;
  }

  activateNear(player) {
    if (this.active) return;
    this.active = true;
    this.x = player.x + (player.facingRight ? 260 : -260);
    this.y = player.y - 70;
    this.bladeCooldown = 300;
  }

  update(dt, player) {
    const onCloud = player.currentPlatform && player.currentPlatform.variant === 'cloud';
    if (onCloud) {
      this.activateNear(player);
    }
    if (!this.active) return;

    if (this.bladeCooldown > 0) this.bladeCooldown -= dt;
    if (this.bladeTimer > 0) {
      this.bladeTimer -= dt;
      if (this.bladeTimer <= 0) {
        this.bladeActive = false;
        this.bladeLinger = 250;
      }
    }
    if (this.bladeLinger > 0) this.bladeLinger -= dt;

    const dtF = dt / 16.667;
    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    this.facingRight = dx > 0;

    this.x += Math.sign(dx) * Math.min(Math.abs(dx), ANGEL_ENEMY.FOLLOW_SPEED * dtF);
    this.y += Math.sign(dy) * Math.min(Math.abs(dy), ANGEL_ENEMY.VERTICAL_SPEED * dtF);

    if (dist < ANGEL_ENEMY.ATTACK_RANGE && this.bladeCooldown <= 0) {
      this.bladeActive = true;
      this.bladeTimer = ANGEL_ENEMY.BLADE_ANIM_MS;
      this.bladeCooldown = ANGEL_ENEMY.BLADE_COOLDOWN_MS;
    }
  }

  getBladeHitbox() {
    if (!this.active || !this.bladeActive) return null;
    return { x: this.x, y: this.y, radius: ANGEL_ENEMY.BLADE_RADIUS };
  }

  checkPlayerHit(playerX, playerY) {
    const hitbox = this.getBladeHitbox();
    if (!hitbox) return false;
    const dx = playerX - hitbox.x;
    const dy = playerY - hitbox.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    return dist < hitbox.radius + PLAYER.WIDTH / 2;
  }

  checkBladeClash(playerBladeHitbox) {
    if (!this.active || !playerBladeHitbox || !this.bladeActive) return false;
    const dx = this.x - playerBladeHitbox.x;
    const dy = this.y - playerBladeHitbox.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist >= playerBladeHitbox.radius + ANGEL_ENEMY.WIDTH / 2) return false;

    this.bladeActive = false;
    this.bladeTimer = 0;
    this.bladeCooldown = ANGEL_ENEMY.BLADE_COOLDOWN_MS * 1.5;
    this.bladeLinger = 250;
    const pushDir = this.x > playerBladeHitbox.x ? 1 : -1;
    this.x += pushDir * 35;
    this.y -= 18;
    return true;
  }

  draw(ctx, cameraX, cameraY) {
    if (!this.active) return;
    const sx = this.x - cameraX;
    const sy = this.y - cameraY;

    ctx.save();

    if (this.bladeActive) {
      const slashProgress = 1 - (this.bladeTimer / ANGEL_ENEMY.BLADE_ANIM_MS);
      const sweepAngle = Math.PI * 2 * slashProgress;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.globalAlpha = 0.9 - slashProgress * 0.25;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.arc(0, 0, ANGEL_ENEMY.BLADE_RADIUS, -Math.PI / 2, -Math.PI / 2 + sweepAngle);
      ctx.stroke();
      ctx.restore();
    } else if (this.bladeLinger > 0) {
      const alpha = this.bladeLinger / 250;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.globalAlpha = alpha * 0.55;
      ctx.beginPath();
      ctx.arc(0, 0, ANGEL_ENEMY.BLADE_RADIUS, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.translate(sx, sy);
    if (!this.facingRight) ctx.scale(-1, 1);

    // Wings
    ctx.fillStyle = 'rgba(220, 250, 255, 0.86)';
    ctx.beginPath();
    ctx.ellipse(-17, 1, 13, 7, -0.45, 0, Math.PI * 2);
    ctx.ellipse(17, 1, 13, 7, 0.45, 0, Math.PI * 2);
    ctx.fill();

    // Halo
    ctx.strokeStyle = '#ffd76a';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#ffd76a';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.ellipse(0, -22, 10, 4, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Body and face
    ctx.fillStyle = '#f7fbff';
    ctx.fillRect(-8, -13, 16, 25);
    ctx.fillStyle = '#dfefff';
    ctx.fillRect(-6, 6, 12, 8);
    ctx.fillStyle = '#ffe7cc';
    ctx.beginPath();
    ctx.arc(0, -14, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff334f';
    ctx.fillRect(3, -15, 3, 3);
    ctx.fillStyle = '#222244';
    ctx.fillRect(-5, -16, 3, 2);
    ctx.fillRect(4, -16, 3, 2);

    ctx.restore();
  }
}

class AngelEnemyManager {
  constructor() {
    this.angel = new AngelEnemy();
  }

  update(dt, player) {
    this.angel.update(dt, player);
  }

  checkPlayerHit(playerX, playerY) {
    return this.angel.checkPlayerHit(playerX, playerY);
  }

  checkBladeClash(playerBladeHitbox) {
    return this.angel.checkBladeClash(playerBladeHitbox);
  }

  draw(ctx, cameraX, cameraY) {
    this.angel.draw(ctx, cameraX, cameraY);
  }
}

class EnemyNinjaManager {
  constructor() {
    this.ninjas = [];
    this.lastSpawnX = 0;
  }

  update(dt, playerX, playerY, world, cameraX) {
    // Update existing ninjas
    for (const ninja of this.ninjas) {
      ninja.update(dt, playerX, playerY, world);
    }
    // Remove dead ones
    this.ninjas = this.ninjas.filter(n => !n.shouldRemove);
    // Remove ninjas far behind camera
    this.ninjas = this.ninjas.filter(n => n.x > cameraX - 600 || n.alive);

    // Spawn new ninjas
    this._trySpawn(playerX, world, cameraX);
  }

  _trySpawn(playerX, world, cameraX) {
    const distance = playerX; // 1px = 1m
    if (distance < ENEMY_NINJA.SPAWN_START_DISTANCE) return;
    if (this.ninjas.filter(n => n.alive).length >= ENEMY_NINJA.MAX_ACTIVE) return;

    const spawnX = cameraX + CANVAS.BASE_WIDTH + 100;
    if (spawnX - this.lastSpawnX < ENEMY_NINJA.SPAWN_INTERVAL_PX) return;

    // Find a platform near the spawn point to place the ninja on
    let bestPlat = null;
    let bestDist = 400;
    for (const p of world.platforms) {
      const platCenterX = p.x + p.width / 2;
      const d = Math.abs(platCenterX - spawnX);
      if (d < bestDist) {
        bestDist = d;
        bestPlat = p;
      }
    }

    if (bestPlat) {
      const nx = bestPlat.x + bestPlat.width / 2;
      const ny = bestPlat.y - ENEMY_NINJA.HEIGHT / 2;
      this.ninjas.push(new EnemyNinja(nx, ny, bestPlat));
      this.lastSpawnX = spawnX;
    }
  }

  /**
   * Check if player blade hits any ninja.
   * Returns { kills: [...], clashes: [...] }
   * Kill = ninja wasn't blading. Clash = both blading (wiggle: 200ms window).
   */
  checkBladeHits(playerBladeHitbox) {
    const result = { kills: [], clashes: [] };
    if (!playerBladeHitbox) return result;
    for (const n of this.ninjas) {
      if (!n.alive) continue;
      const dx = n.x - playerBladeHitbox.x;
      const dy = n.y - playerBladeHitbox.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < playerBladeHitbox.radius + ENEMY_NINJA.WIDTH / 2) {
        // Clash if ninja is blading or was blading very recently (200ms wiggle)
        const ninjaBlading = n.bladeActive ||
          (n.bladeCooldown > 0 && n.bladeCooldown > ENEMY_NINJA.BLADE_COOLDOWN_MS - 200);
        if (ninjaBlading) {
          // Both bounce — cancel ninja blade, stun them
          n.bladeActive = false;
          n.bladeTimer = 0;
          n.bladeCooldown = ENEMY_NINJA.BLADE_COOLDOWN_MS * 2;
          // Bounce ninja away
          const pushDir = n.x > playerBladeHitbox.x ? 1 : -1;
          n.vx = pushDir * 4;
          n.vy = -5;
          if (n.state !== ENinjaState.SWINGING) n.state = ENinjaState.AIRBORNE;
          if (n.hookState === 'attached') { n.hookState = 'idle'; }
          result.clashes.push(n);
        } else {
          n.kill();
          result.kills.push(n);
        }
      }
    }
    return result;
  }

  /**
   * Check if any ninja blade hits the player (player NOT blading).
   * Clashes are handled by checkBladeHits when player IS blading.
   * Returns true if player is killed.
   */
  checkPlayerHit(playerX, playerY) {
    for (const n of this.ninjas) {
      if (!n.alive || !n.bladeActive) continue;
      const hitbox = n.getBladeHitbox();
      if (!hitbox) continue;
      const dx = playerX - hitbox.x;
      const dy = playerY - hitbox.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < hitbox.radius + PLAYER.WIDTH / 2) {
        return true; // ninja blade hit, player dies
      }
    }
    return false;
  }

  draw(ctx, cameraX, cameraY, spriteManager) {
    for (const ninja of this.ninjas) {
      ninja.draw(ctx, cameraX, cameraY, spriteManager);
    }
  }
}

/**
 * Manages spawning and updating all obstacles.
 *
 * RULES:
 * - Birds: harmless, fly by, exist only as blade targets for jump boosts
 * - Drones: stationary, touching = death, slicing = jump boost
 * - Missiles/Projectiles: move toward player, touching = death, sliceable
 */
// ── Building Sniper Bullets ──────────────────────────────────────
// When player hooks a building edge, a sniper inside fires straight bullets.
// These bullets travel in a straight line, can't be bladed, and kill on contact.
class BuildingBullet {
  constructor(x, y, dirX, dirY) {
    this.x = x;
    this.y = y;
    this.vx = dirX * 7;  // bullet speed
    this.vy = dirY * 7;
    this.alive = true;
    this.age = 0;
  }
  update(dt) {
    const dtF = dt / 16.667;
    this.age += dt;
    this.x += this.vx * dtF;
    this.y += this.vy * dtF;
    if (this.age > 3000) this.alive = false; // despawn after 3s
  }
  draw(ctx, cameraX, cameraY) {
    const sx = this.x - cameraX;
    const sy = this.y - cameraY;
    // Bright yellow tracer line
    ctx.save();
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 8;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - this.vx * 2, sy - this.vy * 2); // trailing line
    ctx.stroke();
    // Bright tip
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(sx, sy, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class BuildingSniperManager {
  constructor() {
    this.bullets = [];
    this.muzzleFlashes = []; // visual-only flash at origin
  }

  // Fire a burst of bullets from the building toward the player
  triggerFire(anchorX, anchorY, player) {
    // Sniper fires from slightly below the anchor (inside building)
    const originX = anchorX;
    const originY = anchorY + 25;
    // Fire 3 bullets in a spread toward the player's current position
    const delays = [0, 400, 800]; // staggered burst
    delays.forEach((delay, i) => {
      setTimeout(() => {
        if (!player || !player.alive) return;
        const dx = player.x - originX;
        const dy = player.y - originY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 1) return;
        // Slight spread on each bullet
        const spread = (i - 1) * 0.08;
        const angle = Math.atan2(dy, dx) + spread;
        this.bullets.push(new BuildingBullet(
          originX, originY,
          Math.cos(angle), Math.sin(angle)
        ));
        // Muzzle flash
        this.muzzleFlashes.push({ x: originX, y: originY, timer: 150 });
      }, delay);
    });
  }

  update(dt) {
    for (const b of this.bullets) b.update(dt);
    this.bullets = this.bullets.filter(b => b.alive);
    for (const f of this.muzzleFlashes) f.timer -= dt;
    this.muzzleFlashes = this.muzzleFlashes.filter(f => f.timer > 0);
  }

  // Check if any bullet hits the player (returns true if hit)
  checkPlayerHit(playerX, playerY, playerWidth, playerHeight) {
    const halfW = playerWidth / 2;
    const halfH = playerHeight / 2;
    for (const b of this.bullets) {
      if (b.x > playerX - halfW && b.x < playerX + halfW &&
          b.y > playerY - halfH && b.y < playerY + halfH) {
        b.alive = false;
        return true;
      }
    }
    return false;
  }

  draw(ctx, cameraX, cameraY) {
    for (const b of this.bullets) b.draw(ctx, cameraX, cameraY);
    // Muzzle flashes
    for (const f of this.muzzleFlashes) {
      const sx = f.x - cameraX;
      const sy = f.y - cameraY;
      ctx.save();
      ctx.fillStyle = '#ffaa00';
      ctx.globalAlpha = f.timer / 150;
      ctx.shadowColor = '#ffaa00';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(sx, sy, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  reset() {
    this.bullets = [];
    this.muzzleFlashes = [];
  }
}

class ObstacleManager {
  constructor(seed = 12345) {
    this.obstacles = [];
    this.rng = new SeededRandom(seed ^ 0x51f15eed);
    this.lastSpawnX = 0;
    this.spawnInterval = 300 + this.rng.nextFloat(-ANTI_CHEAT.SPAWN_INTERVAL_JITTER_PX, ANTI_CHEAT.SPAWN_INTERVAL_JITTER_PX);
    this.birdTimer = 0;       // guaranteed bird every 10s
    this.BIRD_INTERVAL_MS = 10000 + this.rng.nextFloat(-ANTI_CHEAT.BIRD_INTERVAL_JITTER_MS, ANTI_CHEAT.BIRD_INTERVAL_JITTER_MS);
  }

  _applyRunJitter(obstacle) {
    if (!obstacle) return obstacle;
    if (obstacle.type === ObstacleType.BIRD) {
      obstacle.speed *= this.rng.nextFloat(1 - ANTI_CHEAT.BIRD_SPEED_JITTER, 1 + ANTI_CHEAT.BIRD_SPEED_JITTER);
      obstacle.wingPhase += this.rng.nextFloat(-0.35, 0.35);
    } else if (obstacle.type === ObstacleType.DRONE) {
      obstacle.moveSpeed *= this.rng.nextFloat(1 - ANTI_CHEAT.DRONE_SPEED_JITTER, 1 + ANTI_CHEAT.DRONE_SPEED_JITTER);
      obstacle.moveRange *= this.rng.nextFloat(0.94, 1.06);
      obstacle.movePhase += this.rng.nextFloat(-0.2, 0.2);
    }
    return obstacle;
  }

  /**
   * Update all obstacles and spawn new ones.
   */
  update(dt, cameraX, playerX, playerY, distance, world) {
    for (const obs of this.obstacles) {
      obs.update(dt, playerX, playerY);
    }

    this.obstacles = this.obstacles.filter(o => !o.shouldRemove(cameraX));
    this._trySpawn(cameraX, playerX, playerY, distance, world);

    // Guaranteed bird every 10 seconds - anti-stranding
    this.birdTimer += dt;
    if (this.birdTimer >= this.BIRD_INTERVAL_MS) {
      this.birdTimer = 0;
      // Spawn bird coming from the right, at player's height +/- random offset
      const birdY = Math.max(60, Math.min(playerY + (this.rng.next() - 0.5) * 100, CANVAS.BASE_HEIGHT - 60));
      this.obstacles.push(this._applyRunJitter(new Bird(cameraX + CANVAS.BASE_WIDTH + 50, birdY, -1, this.rng)));
    }
  }

  _trySpawn(cameraX, playerX, playerY, distance, world) {
    const spawnX = cameraX + CANVAS.BASE_WIDTH + 100;

    if (spawnX - this.lastSpawnX < this.spawnInterval) return;

    const difficultyProgress = Math.min(1, distance / OBSTACLES.SPAWN_RAMP_DISTANCE);
    const spawnRate = OBSTACLES.BASE_SPAWN_RATE +
      (OBSTACLES.MAX_SPAWN_RATE - OBSTACLES.BASE_SPAWN_RATE) * difficultyProgress;

    if (this.rng.next() * 10 > spawnRate) return;

    this.lastSpawnX = spawnX;

    const roll = this.rng.next();
    let spawnY = 80 + this.rng.next() * (CANVAS.BASE_HEIGHT - 200);

    // Check if spawn point overlaps a building or skyscraper — reroll Y up to 5 times
    if (world) {
      for (let attempt = 0; attempt < 5; attempt++) {
        const margin = 40;
        const overlapsBuilding = world.buildings.some(b => {
          return spawnX > b.x - margin && spawnX < b.x + b.width + margin &&
                 spawnY > b.y - margin;
        });
        const overlapsSkyscraper = world.skyscrapers.some(s => {
          return spawnX > s.x - margin && spawnX < s.x + s.width + margin &&
                 spawnY > s.y - margin;
        });
        if (!overlapsBuilding && !overlapsSkyscraper) break;
        spawnY = 80 + this.rng.next() * (CANVAS.BASE_HEIGHT - 200);
      }
    }

    if (distance < 2500) {
      // Early: birds only, no red birds
      const bird = this._applyRunJitter(new Bird(spawnX, spawnY, -1, this.rng));
      bird.isRedBird = false;
      this.obstacles.push(bird);
    } else if (distance < 5000) {
      // Mid: birds + drones, red birds start at 3500m
      if (roll < 0.7) {
        const bird = this._applyRunJitter(new Bird(spawnX, spawnY, -1, this.rng));
        bird.isRedBird = distance > 3500 && this.rng.next() < 0.25;
        this.obstacles.push(bird);
      } else {
        this.obstacles.push(this._applyRunJitter(new Drone(spawnX, spawnY, Math.floor(this.rng.next() * 4), this.rng)));
      }
    } else {
      // Late: all types, red birds active
      if (roll < 0.55) {
        const bird = this._applyRunJitter(new Bird(spawnX, spawnY, -1, this.rng));
        bird.isRedBird = this.rng.next() < 0.25;
        this.obstacles.push(bird);
      } else if (roll < 0.70) {
        this.obstacles.push(this._applyRunJitter(new Drone(spawnX, spawnY, Math.floor(this.rng.next() * 4), this.rng)));
      } else {
        this.obstacles.push(new Missile(spawnX + 300, spawnY, playerX, playerY));
      }
    }
  }

  /**
   * Check if any obstacle is hit by the blade hitbox.
   * Returns array of hit obstacles.
   */
  checkBladeHits(bladeHitbox) {
    if (!bladeHitbox) return [];

    const hits = [];
    for (const obs of this.obstacles) {
      if (obs.checkHit(bladeHitbox)) {
        obs.kill();
        hits.push(obs);
      }
    }
    return hits;
  }

  /**
   * Check if player collides with any DEADLY obstacle.
   * Birds are harmless - only drones and missiles kill on contact.
   */
  checkPlayerCollision(playerX, playerY, playerWidth, playerHeight) {
    for (const obs of this.obstacles) {
      if (!obs.alive) continue;
      // Birds are harmless - skip them
      if (obs.type === ObstacleType.BIRD) continue;
      // Skip frozen (hooked) drones
      if (obs.frozen) continue;

      const dx = obs.x - playerX;
      const dy = obs.y - playerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < obs.size + Math.max(playerWidth, playerHeight) / 2) {
        return obs;
      }
    }
    return null;
  }

  /**
   * Draw all obstacles.
   */
  draw(ctx, cameraX, cameraY) {
    for (const obs of this.obstacles) {
      obs.draw(ctx, cameraX, cameraY);
    }
  }
}
